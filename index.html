function guardarNubeCfg(){ try{ localStorage.setItem(NUBE_KEY,JSON.stringify(NUBE)); }catch(e){} }
function leerVinculo(t){
  t=(t||'').trim(); if(!t) return null;
  try{ const o=JSON.parse(t); if(o.apiKey&&o.projectId) return o; }catch(e){}
  try{ const o=JSON.parse(decodeURIComponent(escape(atob(t)))); if(o.apiKey&&o.projectId) return o; }catch(e){}
  const k=(t.match(/apiKey["'\s:=]+([A-Za-z0-9_\-]{20,})/)||[])[1];
  const pr=(t.match(/projectId["'\s:=]+([a-z0-9][a-z0-9\-]{3,})/)||[])[1];
  if(k&&pr) return {apiKey:k,projectId:pr,authDomain:pr+'.firebaseapp.com'};
  return null;
}
const codigoVinculo=()=>{ try{ return btoa(unescape(encodeURIComponent(JSON.stringify(NUBE)))); }catch(e){ return ''; } };

  if(m){ const c=leerVinculo(decodeURIComponent(m[1]));

/* ---- Firestore por REST ---- */
const TROZO=350000;                                    // Firestore corta en 1 MB por documento
const docUrl=id=>`https://firestore.googleapis.com/v1/projects/${NUBE.projectId}/databases/(default)/documents/elManto/${id}?key=${NUBE.apiKey}`;
async function motivo(r){
  let d=''; try{ const j=await r.json(); d=(j.error&&j.error.message)||''; }catch(e){}
  if(r.status===403) return 'la clave o las reglas de Firestore no dejan escribir';
  if(r.status===404) return 'no existe ese proyecto o falta crear la base Firestore';
  if(r.status===400) return 'petición rechazada'+(d?' — '+d:'');
  return 'error '+r.status+(d?' — '+d:'');
}
async function fsGet(id){
  const r=await fetch(docUrl(id));
  if(r.status===404) return null;
  if(!r.ok) throw new Error(await motivo(r));
  return r.json();
}
async function fsPut(id,campos){
  const r=await fetch(docUrl(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:campos})});
  if(!r.ok) throw new Error(await motivo(r));
  return r.json();
}
/* Cada subida lleva un sello propio y el largo total. Al bajar se comprueba
   que TODOS los trozos sean de la misma subida: así, si dos equipos suben a la
   vez o una subida quedó a medias, se detecta en vez de armar un texto roto. */
const aMedias=()=>{ const e=new Error('la copia de la nube quedó a medias'); e.incompleto=true; return e; };
async function bajarEstado(){
  const cab=await fsGet('estado');
  if(!cab||!cab.fields) return null;
  const f=cab.fields;
  const partes=parseInt((f.partes&&f.partes.integerValue)||'1',10)||1;
  const sello=(f.sello&&f.sello.stringValue)||'';
  const largo=parseInt((f.largo&&f.largo.integerValue)||'0',10)||0;
  let txt=(f.datos&&f.datos.stringValue)||'';
  for(let i=1;i<partes;i++){
    const p=await fsGet('parte'+i);
    const pf=p&&p.fields;
    if(!pf) throw aMedias();                              // falta un trozo
    const ps=(pf.sello&&pf.sello.stringValue)||'';
    if(sello&&ps&&ps!==sello) throw aMedias();            // trozo de otra subida
    txt+=(pf.datos&&pf.datos.stringValue)||'';
  }
  if(largo&&txt.length!==largo) throw aMedias();
  try{ return JSON.parse(txt); }catch(e){ throw aMedias(); }
}
async function subirEstado(){
  const copia={...E}; delete copia.firebase; delete copia.nubeUlt;
  const txt=JSON.stringify(copia);
  const sello=new Date().toISOString()+'·'+Math.random().toString(36).slice(2,7);
  const trozos=[]; for(let i=0;i<txt.length;i+=TROZO) trozos.push(txt.slice(i,i+TROZO));
  if(!trozos.length) trozos.push('{}');
  for(let i=1;i<trozos.length;i++)
    await fsPut('parte'+i,{datos:{stringValue:trozos[i]},sello:{stringValue:sello}});
  await fsPut('estado',{datos:{stringValue:trozos[0]},
    partes:{integerValue:String(trozos.length)},
    largo:{integerValue:String(txt.length)},
    sello:{stringValue:sello}});
}

/* ---- fusión ----
   Regla base: de cada clave gana la versión con la marca más nueva.
   Pero si la clave es una LISTA (pactos, tesorería, hábitos, diario…) se
   fusiona elemento por elemento, para que dos equipos puedan agregar cosas
   distintas el mismo día sin que uno borre lo del otro. Si un elemento falta
   en el lado con la marca más nueva, se entiende que ahí lo borraron. */
const claveDe=x=>(x&&typeof x==='object')?x.id:x;
const listaFusionable=a=>Array.isArray(a)&&a.every(x=>
  (x&&typeof x==='object'&&typeof x.id==='string')||typeof x==='string'||typeof x==='number');
function fusionarLista(loc,rem,tl,tr,miL,miR,xL,xR){
  const mLoc=new Map(loc.map(x=>[claveDe(x),x])), mRem=new Map(rem.map(x=>[claveDe(x),x]));
  /* Para decidir CONTENIDO se usa la marca del elemento (0 = nadie lo tocó
     desde la última fusión, así un elemento intacto nunca pisa al editado).
     Para decidir PRESENCIA se usa la marca de la sección: si allá la lista es
     más reciente y el elemento ya no está, es que lo borraron. */
  const sello=(mi,id)=>(mi&&mi[id])||0;
  const lapida=(x,id)=>(x&&x[id])||0;
  const marcas={}, salida=[];
  const orden=[], vistos=new Set();
  (tr>tl?rem:loc).forEach(x=>{ const k=claveDe(x); if(!vistos.has(k)){vistos.add(k);orden.push(k);} });
  (tr>tl?loc:rem).forEach(x=>{ const k=claveDe(x); if(!vistos.has(k)){vistos.add(k);orden.push(k);} });
  orden.forEach(id=>{
    const enL=mLoc.has(id), enR=mRem.has(id);
    const sL=sello(miL,id), sR=sello(miR,id);
    if(enL&&enR){                                    // los dos lo tienen: gana el más reciente
      salida.push(sR>sL?mRem.get(id):mLoc.get(id));
      marcas[id]=Math.max(sL,sR);
    }else if(enL){                                   // solo aquí: se conserva salvo que allá conste borrado
      if(lapida(xR,id)>sL) return;
      salida.push(mLoc.get(id)); marcas[id]=sL;
    }else{
      if(lapida(xL,id)>sR) return;
      salida.push(mRem.get(id)); marcas[id]=sR;
    }
  });
  return {lista:salida,marcas};
}
function fusionar(rem){
  if(!rem||typeof rem!=='object') return 0;
  const rm=(rem._m&&typeof rem._m==='object')?rem._m:{};
  const lm=(E._m&&typeof E._m==='object')?E._m:{};
  const rmi=(rem._mi&&typeof rem._mi==='object')?rem._mi:{};
  const lmi=(E._mi&&typeof E._mi==='object')?E._mi:(E._mi={});
  const rx=(rem._x&&typeof rem._x==='object')?rem._x:{};
  const lx=(E._x&&typeof E._x==='object')?E._x:(E._x={});
  Object.keys(rx).forEach(k=>{                      // las lápidas se suman de los dos lados
    const d=lx[k]||(lx[k]={});
    Object.keys(rx[k]).forEach(id=>{ d[id]=Math.max(d[id]||0,rx[k][id]); });
  });
  const virgen=Object.keys(lm).length===0;   // equipo que nunca ha sincronizado: adopta la nube
  if(virgen) guardarRescate();               // ...pero antes deja a salvo lo que hubiera aquí
  let n=0;
  Object.keys(rem).forEach(k=>{
    if(IGNORA.has(k)) return;
    const tr=rm[k]||0, tl=lm[k]||0;
    let nuevo, marcasIt=null;
    if(virgen||E[k]===undefined){ nuevo=rem[k]; marcasIt=(rmi[k]?{...rmi[k]}:null); }
    else if(listaFusionable(E[k])&&listaFusionable(rem[k])){
      const r=fusionarLista(E[k],rem[k],tl,tr,lmi[k],rmi[k],lx[k],rx[k]);
      nuevo=r.lista; marcasIt=r.marcas;
    }
    else if(tr>tl) nuevo=rem[k];
    else return;
    const antes=jsonDe(E[k]), despues=jsonDe(nuevo);
    if(antes!==despues){ n++; E[k]=nuevo; if(tl>=tr) lm[k]=Date.now(); }
    if(marcasIt) lmi[k]=marcasIt;
    lm[k]=Math.max(lm[k]||0,tr,tl);
  });
  E._m=lm; E._mi=lmi; E._x=lx;
  podarLapidas();
  return n;
}
/* La primera vez que un equipo se vincula adopta lo que hay en la nube.
   Si este equipo ya tenía historia propia, se guarda aparte antes de pisarla. */
const RESCATE_KEY='el-manto:antes-de-vincular';
const hayRescate=()=>{ try{ return !!localStorage.getItem(RESCATE_KEY); }catch(e){ return false; } };

    const vacio=!E.pactos.length&&!E.diario.length&&!E.hechos.length&&!E.tesoreria.length

function bajarRescate(){

const LAPIDA_VIDA=90*24*3600*1000;                 // 90 días y el borrado se olvida
function podarLapidas(){
  const corte=Date.now()-LAPIDA_VIDA;
  Object.keys(E._x||{}).forEach(k=>{
    Object.keys(E._x[k]).forEach(id=>{ if(E._x[k][id]<corte) delete E._x[k][id]; });
    if(!Object.keys(E._x[k]).length) delete E._x[k];
  });
}
function ocupado(){
  if(document.getElementById('velo')) return true;
  const a=document.activeElement;
  return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
function pintarSync(estado,txt){
  const b=document.getElementById('btnSync');
  if(b){ b.dataset.s=estado; b.title=txt;
    b.textContent=estado==='sync'?'◐':estado==='ok'?'●':estado==='mal'?'▲':'○'; }
  const e=document.getElementById('estadoNube'); if(e) e.textContent=txt;
}
function programarSubida(){
  if(!nubeLista()) return;
  clearTimeout(tRebote); tRebote=setTimeout(()=>sincronizar(true),1800);
}
async function sincronizar(silencio){
  if(!nubeLista()){ if(!silencio) aviso('Primero vincula este equipo (⚙)'); return; }
  if(sincronizando){ colaSync=true; return; }
  sincronizando=true; clearTimeout(tRebote); pintarSync('sync','Sincronizando…');
  try{
    let rem=null, reparada=false;
    try{ rem=await bajarEstado(); }
    catch(err){
      if(!err.incompleto) throw err;
      await new Promise(r=>setTimeout(r,1500));           // pudo ser otro equipo subiendo
      try{ rem=await bajarEstado(); }
      catch(err2){
        if(!err2.incompleto) throw err2;
        reparada=true;                                    // sigue rota: la reescribimos desde aquí
      }
    }
    const n=rem?fusionar(rem):0;
    if(n){ refrescarSombra(); if(!ocupado()) pintar(); }
    await subirEstado();
    E.nubeUlt=new Date().toLocaleString('es-CO');
    await Guardado.escribir(CLAVE,E);
    pintarSync('ok',(reparada?'Nube reescrita desde este equipo · '
                     :n?`Recibí ${n} cambio${n>1?'s':''} · `:'Al día · ')+E.nubeUlt);
    if(!silencio) aviso(reparada?'La nube estaba a medias — la reescribí con lo de este equipo'
                        :n?`Al día — ${n} cambio${n>1?'s':''} recibido${n>1?'s':''}`:'Al día');
  }catch(err){
    const m=String(err.message||err);
    pintarSync('mal','No sincronizó: '+m);
    if(!silencio) aviso('No sincronizó: '+m);
  }finally{
    sincronizando=false;
    if(colaSync){ colaSync=false; setTimeout(()=>sincronizar(true),500); }
  }
}
function vincular(){
  const c=leerVinculo($('#fbCodigo').value);
  if(!c) return aviso('No reconocí ese código ni esa configuración');
  NUBE=c; guardarNubeCfg(); abrirAjustes(); sincronizar();
}
function copiarVinculo(){
  const t=codigoVinculo(); if(!t) return;
  const ok=()=>aviso('Código copiado — pégalo en el otro equipo');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,()=>pedir(t));
  else pedir(t);
  function pedir(x){ prompt('Copia este código y pégalo en el otro equipo:',x); }
}
function desvincular(){
  NUBE=null; try{ localStorage.removeItem(NUBE_KEY); }catch(e){}
  pintarSync('off','Sin vincular'); abrirAjustes();
}
function forzarSubida(){                       // este equipo manda: pisa la nube
  const ahora=Date.now(); E._m={}; E._mi={}; E._x={};
  Object.keys(E).forEach(k=>{
    if(IGNORA.has(k)) return;
    E._m[k]=ahora;
    if(listaFusionable(E[k])){ const m={}; E[k].forEach(x=>m[claveDe(x)]=ahora); E._mi[k]=m; }
  });
  refrescarSombra(); Guardado.escribir(CLAVE,E); cerrarVelo(); sincronizar();
}
function forzarBajada(){                       // la nube manda: pisa este equipo
  E._m={}; sombra=null; cerrarVelo(); sincronizar();
}

let exAbierto={};
function asegurarGym(){
  if(!E.gym||!E.gym.v2) E.gym={v2:true,rutina:structuredClone(RUTINA_BASE),log:{},peso:[],diario:[]};
  ['log'].forEach(k=>{ if(!E.gym[k]||typeof E.gym[k]!=='object') E.gym[k]={}; });
  ['peso','diario'].forEach(k=>{ if(!Array.isArray(E.gym[k])) E.gym[k]=[]; });
  return E.gym;
}
function rachaGym(){
  const s=new Set(asegurarGym().diario);
  let dias=0, saltos=0, cursor=hoy();
  if(!s.has(cursor)) cursor=menosDias(cursor,1);
  for(let k=0;k<400;k++){
    if(s.has(cursor)){ dias++; saltos=0; }
    else { saltos++; if(saltos>1) break; }        // un día de descanso no rompe nada
    cursor=menosDias(cursor,1);
  }
  return dias;
}
function seriesDe(iso,ex){
  const g=asegurarGym();
  if(!g.log[iso]) g.log[iso]={};
  if(!g.log[iso][ex.id]) g.log[iso][ex.id]=Array.from({length:ex.sets},()=>({kg:'',reps:'',hecha:false}));
  const s=g.log[iso][ex.id];
  while(s.length<ex.sets) s.push({kg:'',reps:'',hecha:false});
  return s;
}
function ultimaVez(exId,iso){
  const g=asegurarGym();
  const fechas=Object.keys(g.log).filter(f=>f<iso&&g.log[f][exId]&&g.log[f][exId].some(s=>s.hecha)).sort();
  if(!fechas.length) return null;
  const f=fechas[fechas.length-1], series=g.log[f][exId].filter(s=>s.hecha);
  return {f, kg:Math.max(...series.map(s=>parseFloat(s.kg)||0)), series:g.log[f][exId]};
}
function volumen(iso){
  const g=asegurarGym(), d=g.log[iso]||{};
  return Object.values(d).flat().filter(s=>s.hecha)
    .reduce((a,s)=>a+(parseFloat(s.kg)||0)*(parseInt(s.reps)||0),0);
}

function fijarSerie(exId,i,campo,valor){
  const g=asegurarGym(), iso=hoy();
  g.log[iso][exId][i][campo]=valor;
  if(campo==='kg'&&valor) g.log[iso][exId][i].hecha=true;
  guardar(); pintar();
}
function alternarSerie(exId,i){
  const g=asegurarGym(), s=g.log[hoy()][exId][i];
  s.hecha=!s.hecha; guardar(); pintar();
}
function agregarSerie(exId){
  const g=asegurarGym();
  g.log[hoy()][exId].push({kg:'',reps:'',hecha:false});
  guardar(); pintar();
}
function cerrarSesion(dow){
  const g=asegurarGym(), iso=hoy();
  if(g.diario.includes(iso)) return;
  const hechas=Object.values(g.log[iso]||{}).flat().filter(s=>s.hecha).length;
  if(!hechas) return aviso('Marca al menos una serie');
  g.diario.push(iso);
  E.stats['Fuerza']=(E.stats['Fuerza']||0)+2;
  E.stats['Resiliencia']=(E.stats['Resiliencia']||0)+1;
  E.stats['Disciplina']=(E.stats['Disciplina']||0)+1;
  ganarXP(XP.gym);
  guardar(); pintar();
  aviso('Sesión forjada · '+Math.round(volumen(iso)).toLocaleString('es-CO')+' kg movidos');
}

    </div>
    <div class="btn-fila">
      <button class="btn" onclick="ejercicioPropio()">Crear uno propio</button>
    </div>

    <div class="btn-fila" style="margin-top:var(--s4)">
      <button class="btn oro" onclick="guardarBorrador()">Guardar rutina</button>
      <button class="btn" onclick="borrador=null;cerrarVelo()">Cancelar</button>
    </div>`);
}
function agregarEj(n){
  const b=borrador; if(!b) return;
  const i=b.e.findIndex(x=>x.n===n);
  if(i>-1) b.e.splice(i,1);
  else b.e.push({id:'x'+Math.random().toString(36).slice(2,7),n,sets:3,reps:'10'});
  editorRutina();
}
function quitarEj(i){ borrador.e.splice(i,1); editorRutina(); }
function moverEj(i,d){
  const b=borrador, j=i+d;
  if(j<0||j>=b.e.length) return;
  [b.e[i],b.e[j]]=[b.e[j],b.e[i]];
  editorRutina();
}
function ajustar(i,campo,d){
  const x=borrador.e[i];
  x[campo]=Math.max(1,Math.min(10,(x[campo]||3)+d));
  editorRutina();
}
function ejercicioPropio(){
  const n=(prompt('Nombre del ejercicio')||'').trim();
  if(!n) return;
  borrador.e.push({id:'x'+Math.random().toString(36).slice(2,7),n,sets:3,reps:'10'});
  editorRutina();
}
function guardarBorrador(){
  const g=asegurarGym(), b=borrador;
  if(!b.e.length) g.rutina[b.dow]=null;
  else g.rutina[b.dow]={n:b.n||'Sesión',foco:b.foco,e:b.e};
  borrador=null; guardar(); cerrarVelo(); pintar();
}

/* ---------- progreso ---------- */
function grafico(puntos,{w=300,h=90,color='var(--oro)'}={}){
  if(puntos.length<2) return `<div class="vacio">Necesitas al menos dos registros para ver la curva.</div>`;
  const vs=puntos.map(p=>p.v), min=Math.min(...vs), max=Math.max(...vs), rango=(max-min)||1;
  const px=i=>8+i*(w-16)/(puntos.length-1);
  const py=v=>h-10-((v-min)/rango)*(h-24);
  const linea=puntos.map((p,i)=>`${px(i).toFixed(1)},${py(p.v).toFixed(1)}`).join(' ');
  return `<svg class="grafico" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polygon points="8,${h-4} ${linea} ${px(puntos.length-1).toFixed(1)},${h-4}" fill="${color}" opacity=".10"/>
    <polyline points="${linea}" fill="none" stroke="${color}" stroke-width="1.6"
      stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${puntos.map((p,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(p.v).toFixed(1)}" r="2" fill="${color}">
      <title>${p.f} · ${p.v}</title></circle>`).join('')}
  </svg>`;
}
function historialEx(exId){
  const g=asegurarGym();
  return Object.keys(g.log).filter(f=>g.log[f][exId]&&g.log[f][exId].some(s=>s.hecha)).sort()
    .map(f=>({f, kg:Math.max(...g.log[f][exId].filter(s=>s.hecha).map(s=>parseFloat(s.kg)||0))}))
    .filter(x=>x.kg>0);
}
function vistaProgreso(){
  const g=asegurarGym();
  const peso=[...g.peso].sort((a,b)=>a.f.localeCompare(b.f));
  const ult=peso[peso.length-1], prim=peso[0];
  const hace30=peso.filter(p=>p.f<=menosDias(hoy(),30)).pop();
  const dif=ult&&hace30?(ult.kg-hace30.kg):null;

  const vistos=new Set(), ejercicios=[];
  Object.values(g.rutina).filter(Boolean).forEach(d=>d.e.forEach(ex=>{
    if(vistos.has(ex.id)) return; vistos.add(ex.id);
    const h=historialEx(ex.id);
    if(h.length) ejercicios.push({ex,dia:d.n,h});
  }));

  return `<section>
    <div class="titulo"><h2>Progreso</h2>
      <button class="btn" onclick="vistaGymTab='sesion';pintar()">Volver a la sesión</button></div>

    <div class="carta">
      <div class="titulo"><span class="eyebrow">Peso corporal</span>
        <button class="btn" onclick="registrarPeso()">Registrar</button></div>
      <div class="peso-cifras">
        <div><b>${ult?ult.kg:'—'}</b><i>kg</i></div>
        <div><b class="${dif===null?'':dif<0?'verde':'oro'}">${dif===null?'—':(dif>0?'+':'')+dif.toFixed(1)}</b><i>30 días</i></div>
        <div><b>${prim&&ult?((ult.kg-prim.kg>0?'+':'')+(ult.kg-prim.kg).toFixed(1)):'—'}</b><i>total</i></div>
        <div><b>${peso.length}</b><i>registros</i></div>
      </div>
      ${grafico(peso.slice(-24).map(p=>({f:p.f.split('-').reverse().slice(0,2).join('/'),v:p.kg})))}
    </div>

    <div class="titulo" style="margin:var(--s4) 0 var(--s2)"><span class="eyebrow">Cargas</span>
      <span class="eyebrow">${ejercicios.length} ejercicios</span></div>
    ${ejercicios.length?ejercicios.map(x=>{
      const ini=x.h[0].kg, fin=x.h[x.h.length-1].kg, sube=fin-ini;
      return `<button class="ejercicio-prog" onclick="verEjercicio('${x.ex.id}')">
        <div style="flex:1;min-width:0"><b>${esc(x.ex.n)}</b><i>${esc(x.dia)} · ${x.h.length} sesiones</i></div>
        <div class="mini">${grafico(x.h.slice(-12).map(p=>({f:p.f,v:p.kg})),{w:120,h:34,color:'var(--savia)'})}</div>
        <div class="cifra"><b>${fin}</b><u class="${sube>=0?'verde':'rojo'}">${sube>=0?'+':''}${sube.toFixed(1)}</u></div>
      </button>`;}).join('')
      :`<div class="vacio">Sin historial todavía. Se llena solo con las series que marques.</div>`}
  </section>`;
}
function registrarPeso(){
  const g=asegurarGym(), hoyReg=g.peso.find(p=>p.f===hoy());
  velo(`<h2 style="font-size:26px">Peso corporal</h2>
    <p class="lead">Pésate siempre igual: al despertar, antes de comer.</p>
    <div class="dos-campos">
      <label><span>Kilos</span><input id="pKg" type="number" step="0.1" inputmode="decimal"
        value="${hoyReg?hoyReg.kg:''}" placeholder="0.0"></label>
      <label><span>Fecha</span><input id="pF" type="date" value="${hoy()}"></label>
    </div>
    <div class="btn-fila">
      <button class="btn oro" onclick="guardarPeso()">Guardar</button>
      <button class="btn" onclick="cerrarVelo()">Cancelar</button>
    </div>`);
}
function guardarPeso(){
  const kg=parseFloat($('#pKg').value), f=$('#pF').value||hoy();
  if(!kg) return aviso('Escribe un peso válido');
  const g=asegurarGym();
  g.peso=g.peso.filter(p=>p.f!==f);
  g.peso.push({f,kg:Math.round(kg*10)/10});
  guardar(); cerrarVelo(); pintar();
}
function verEjercicio(exId){
  const h=historialEx(exId);
  let ex=null, dia='';
  Object.values(asegurarGym().rutina).filter(Boolean).forEach(d=>d.e.forEach(x=>{ if(x.id===exId){ex=x;dia=d.n;} }));
  if(!ex) return;
  const pr=Math.max(...h.map(p=>p.kg));
  velo(`<h2 style="font-size:26px">${esc(ex.n)}</h2>
    <div class="eyebrow" style="margin-top:4px">${esc(dia)} · ${ex.sets} × ${esc(ex.reps)} · récord ${pr} kg</div>
    ${grafico(h.slice(-20).map(p=>({f:p.f.split('-').reverse().slice(0,2).join('/'),v:p.kg})),{w:420,h:120,color:'var(--savia)'})}
    <div class="registro" style="margin-top:var(--s3)">
      ${h.slice(-12).reverse().map(p=>`<span>${esc(p.f.split('-').reverse().slice(0,2).join('/'))} · ${p.kg} kg</span>`).join('')}
    </div>
    <div class="btn-fila"><button class="btn" onclick="cerrarVelo()">Cerrar</button></div>`);
}
/* ==================== velo ==================== */
function velo(html){
  cerrarVelo();
  const v=document.createElement('div'); v.className='velo'; v.id='velo';
  v.innerHTML=`<div class="velo-caja">${html}</div>`;
  v.addEventListener('click',ev=>{ if(ev.target===v) cerrarVelo(); });
  document.body.appendChild(v);
}
function cerrarVelo(){ const v=$('#velo'); if(v) v.remove(); }

/* ==================== pintar ==================== */
function pintar(){
  if(tab!=='personaje') cerrarPanel();
  document.documentElement.style.setProperty('--marca', E.sigilo?`url(${E.sigilo})`:'none');
  const si=$('#sigiloImg'), sv=$('#sigiloSvg');
  if(si&&sv){
    si.style.display=E.sigilo?'':'none'; sv.style.display=E.sigilo?'none':'';
    if(E.sigilo&&si.src!==E.sigilo) si.src=E.sigilo;
    si.onclick=sv.onclick=verEscudo;
  }
  $('#portador').firstChild.textContent=E.portador;
  $('#fecha').textContent=new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
  pintarManto();
  $('#app').innerHTML = tab==='personaje'?vistaPersonaje()
    : tab==='gym'?vistaGym()
    : tab==='pactos'?vistaPactos()
    : tab==='tesoreria'?vistaTesoreria()
    : tab==='claro'?vistaClaro()
    : tab==='horizonte'?vistaHorizonte()
    : tab==='biblioteca'?vistaBiblioteca()
    : vistaNodos();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(tab==='pactos'&&pactoAbierto===null) activarArrastre();
  if(tab==='nodos'&&nodoAbierto===null){ activarArrastreNodos(); arrancarGiro(); }
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t; tomado=null; vistaGymTab='sesion'; verObjeto=null; filtro='Todo'; nodoAbierto=null; pactoAbierto=null;  window.scrollTo(0,0); pintar();
});
cargar();
</script>
</body>
</html>
