<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Manto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Barlow+Condensed:wght@400;500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* superficies */
  --fondo:#07070B;
  --carta:#14131B;
  --hueco:#0F0E15;
  --linea:#282634;
  --linea-viva:#3E3A50;
  /* tinta */
  --tinta:#D8D3DC;
  --tinta-2:#928C9C;
  --tinta-3:#635E6E;
  /* acentos del escudo */
  --oro:#C9A63F;
  --oro-vivo:#EFD37A;
  --aurora:#2C4E8F;      /* azul real — magia, selección, buffs */
  --sangre:#8E1C22;      /* granate — límites y peligro */
  --savia:#1F6B44;       /* verde bosque — lo cumplido */
  /* ritmo */
  --r:3px;
  --s1:8px; --s2:12px; --s3:16px; --s4:24px; --s5:32px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fondo);
  color:var(--tinta);
  font-family:'Barlow',system-ui,sans-serif;
  font-size:14px;line-height:1.55;
  min-height:100vh;padding-bottom:92px;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1000px 560px at 50% -14%, rgba(201,166,63,.10), transparent 60%),
    radial-gradient(820px 560px at 100% 104%, rgba(142,28,34,.16), transparent 62%),
    radial-gradient(700px 500px at 0% 40%, rgba(44,78,143,.10), transparent 64%)}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0;line-height:1.15}
p{margin:0}
.wrap{max-width:820px;margin:0 auto;padding:0 var(--s3)}

/* etiquetas de sistema — un solo tratamiento en toda la app */
.eyebrow,.rareza,.tipo-tag,.vinculo,.prog,.xp-l,.rito-stats,.stat-n,.chip,.btn,.slot .et,.celda .et,.rango-tag,.campo b,.detalle-lista b,.pista{
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.18em;font-weight:500;
}
.eyebrow{font-size:11px;color:var(--tinta-2)}

/* ---------- cabecera ---------- */
header{padding:var(--s5) 0 var(--s3);position:relative}
header::before{content:"";position:absolute;right:-50px;top:-40px;width:300px;height:420px;
  background:var(--marca) center/contain no-repeat;opacity:.08;pointer-events:none;z-index:0;
  -webkit-mask-image:radial-gradient(closest-side,#000 40%,transparent 100%);
  mask-image:radial-gradient(closest-side,#000 40%,transparent 100%)}
.corona,.manto{position:relative;z-index:1}
.corona{display:flex;align-items:center;gap:var(--s3);padding-bottom:var(--s3);
  border-bottom:1px solid transparent;
  border-image:linear-gradient(90deg,rgba(201,166,63,.6),rgba(142,28,34,.4) 40%,rgba(44,78,143,.35) 70%,transparent) 1}
.sigilo{width:62px;height:88px;flex:none;cursor:pointer;object-fit:contain;
  filter:drop-shadow(0 4px 16px rgba(201,166,63,.28))}
.sigilo:hover{filter:drop-shadow(0 4px 20px rgba(201,166,63,.4))}
.portador{font-family:'Cormorant Garamond',serif;font-size:28px;letter-spacing:.01em}
.portador small{display:block;font-family:'Barlow Condensed';font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--tinta-3);margin-top:5px}

/* ---------- el manto ---------- */
.manto{margin-top:var(--s3);border:1px solid var(--linea);border-radius:var(--r);
  padding:var(--s3);position:relative;overflow:hidden;background:var(--carta)}
.manto.activo{border-color:rgba(168,31,53,.45);
  background:linear-gradient(115deg,rgba(168,31,53,.20),var(--carta) 58%,rgba(192,162,74,.09))}
.manto.activo::after{content:"";position:absolute;inset:-45% -12%;pointer-events:none;will-change:transform;
  background:radial-gradient(closest-side,rgba(168,31,53,.30),transparent 70%);
  animation:deriva 11s ease-in-out infinite alternate}
@keyframes deriva{from{transform:translate3d(-12%,4%,0)}to{transform:translate3d(14%,-6%,0) scale(1.12)}}
.manto-fila{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);position:relative;z-index:1}
.manto-nombre{font-family:'Cormorant Garamond',serif;font-size:21px}
.manto-desc{font-size:13px;color:var(--tinta-2);margin-top:4px;max-width:46ch}
.reloj{font-family:'Barlow Condensed';font-size:26px;letter-spacing:.06em;color:var(--oro-vivo);
  line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.reloj small{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--tinta-3);text-align:right;margin-top:5px}

/* ---------- navegación ---------- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#0B0A11;
  border-top:1px solid var(--linea)}
.nav-in{max-width:820px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav-in button{flex:1 0 auto;min-width:64px}
nav button{background:none;border:0;color:var(--tinta-3);padding:11px 2px 15px;cursor:pointer;
  font-family:'Barlow Condensed';text-transform:uppercase;letter-spacing:.04em;font-size:9px;
  display:flex;flex-direction:column;align-items:center;gap:5px;border-top:2px solid transparent;transition:.16s}
nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.3}
nav button.on{color:var(--oro-vivo);border-top-color:var(--oro)}

/* ---------- estructura ---------- */
section{padding:var(--s4) 0 var(--s2)}
.titulo{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.titulo h2{font-size:28px}
.lead{color:var(--tinta-2);font-size:13.5px;margin:var(--s1) 0 var(--s4);max-width:58ch}
.carta{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);
  padding:var(--s3);margin-bottom:var(--s2)}
.vacio{color:var(--tinta-3);font-size:13px;font-style:italic;padding:var(--s2) 0}

/* ---------- rito ---------- */
.barra-rito{height:2px;background:var(--linea);margin:var(--s2) 0 var(--s4);border-radius:2px;overflow:hidden}
.barra-rito i{display:block;height:100%;background:linear-gradient(90deg,var(--aurora),var(--oro));transition:width .5s}
.rito{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);
  border:1px solid var(--linea);background:var(--carta);margin-bottom:6px;cursor:pointer;
  border-radius:var(--r);transition:.16s}
.rito:hover{border-color:var(--linea-viva)}
.rito .marca{width:20px;height:20px;flex:none;border:1px solid var(--tinta-3);border-radius:2px;position:relative}
.rito.hecho{border-color:rgba(192,162,74,.35);background:linear-gradient(90deg,rgba(192,162,74,.08),var(--carta) 40%)}
.rito.hecho .marca{border-color:var(--oro);background:var(--oro)}
.rito.hecho .marca::after{content:"";position:absolute;left:6.5px;top:3px;width:4px;height:10px;
  border:solid var(--fondo);border-width:0 2px 2px 0;transform:rotate(42deg)}
.rito.hecho .rito-nombre{color:var(--oro-vivo)}
.rito-nombre{font-size:15px}
.rito-stats{font-size:10.5px;color:var(--tinta-3);margin-top:2px}

/* ---------- hoja de personaje ---------- */
.hoja{border:1px solid var(--linea);background:var(--carta);border-radius:var(--r);overflow:hidden;contain:paint}
.hoja img,.hoja svg{max-width:100%}
.hoja-id{padding:var(--s3) var(--s3) var(--s2);border-bottom:1px solid var(--linea);
  display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s4);flex-wrap:wrap}
.hoja-id h2{font-size:30px}
.titulo-nobiliario{font-family:'Barlow Condensed';font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--aurora);margin-top:6px}
.xp{flex:1;min-width:200px}
.xp-b{height:4px;background:var(--hueco);border:1px solid var(--linea);border-radius:3px;overflow:hidden}
.xp-b i{display:block;height:100%;background:linear-gradient(90deg,var(--aurora),var(--oro-vivo));transition:width .6s}
.xp-l{display:flex;justify-content:space-between;gap:var(--s2);font-size:10px;color:var(--tinta-3);margin-top:6px}

/* cámara: retrato flanqueado por ranuras, todo a la misma altura */
.camara{display:grid;grid-template-columns:88px minmax(0,1fr) 88px;gap:var(--s2);
  padding:var(--s3);align-items:stretch;
  background:radial-gradient(58% 66% at 50% 16%,rgba(168,31,53,.12),transparent 72%)}
.col-slots{display:grid;grid-auto-rows:1fr;gap:var(--s1);min-width:0}
.escenario{display:flex;flex-direction:column;min-width:0}
.bajo-camara{display:flex;flex-direction:column;gap:var(--s2);padding:0 var(--s3) var(--s3);
  border-bottom:1px solid var(--linea)}
.retrato{position:relative;flex:1;min-height:352px;cursor:zoom-in;border:1px solid var(--linea-viva);
  border-radius:var(--r);overflow:hidden;
  background:radial-gradient(circle at 50% 26%,rgba(168,31,53,.26),var(--hueco) 74%)}
.retrato img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.retrato.cuerpo img{object-position:50% 50%}
.retrato.completo img{object-fit:contain;background:var(--hueco)}
.retrato svg{position:absolute;left:16%;top:14%;width:68%;height:68%;opacity:.55}
.retrato svg.oculto{display:none}
.retrato::before{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 -70px 60px -44px rgba(10,9,16,.95), inset 0 0 70px rgba(10,9,16,.45)}
.retrato-pista{position:absolute;left:0;right:0;bottom:46px;text-align:center;
  font-family:'Barlow Condensed';font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--tinta-3)}
.rango-tag{position:absolute;bottom:0;left:0;right:0;background:rgba(10,9,16,.82);
  border-top:1px solid var(--linea);font-size:10px;text-align:center;padding:7px 4px;
  color:var(--oro-vivo);z-index:2}
.escudo-grande{max-width:460px;width:100%;margin:auto}
.escudo-grande img{width:100%;display:block;max-height:70vh;object-fit:contain;
  filter:drop-shadow(0 10px 44px rgba(201,166,63,.25))}
.escudo-grande .pie{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);
  padding-top:var(--s3);margin-top:var(--s3);border-top:1px solid var(--linea)}
@media(max-width:560px){.sigilo{width:48px;height:68px}.portador{font-size:23px}
  header::before{width:200px;right:-30px}}
.retrato-grande{max-width:520px;width:100%;margin:auto;border:1px solid var(--linea-viva);
  border-radius:var(--r);overflow:hidden;background:var(--carta)}
.retrato-grande img{width:100%;display:block;max-height:74vh;object-fit:contain;background:var(--hueco)}
.retrato-grande .pie{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);
  padding:var(--s3);border-top:1px solid var(--linea)}

/* ranuras */
.slot{border:1px solid var(--linea);background:var(--hueco);border-radius:var(--r);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:6px;cursor:grab;color:var(--tinta-3);position:relative;overflow:hidden;transition:.16s;text-align:center}
.slot:hover{border-color:var(--linea-viva);color:var(--tinta-2)}
.slot svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.2;position:relative;z-index:1}
.slot .et{font-size:9px;letter-spacing:.1em;line-height:1.15;position:relative;z-index:1;
  text-shadow:0 1px 3px rgba(10,9,16,.95)}
.slot.lleno{border-color:rgba(192,162,74,.45);color:var(--oro-vivo)}
.slot.libre{border-color:rgba(168,31,53,.7);color:var(--aurora)}
.slot.vetado{opacity:.25;pointer-events:none}
.slot.sobre{border-color:var(--oro);background:rgba(192,162,74,.14)}
.slot.rechaza{animation:sacudir .34s ease;border-color:var(--sangre)}
@keyframes sacudir{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.slot .quitar{position:absolute;top:1px;right:5px;font-style:normal;font-size:14px;line-height:1;
  color:var(--tinta-3);padding:2px 3px;z-index:2}
.slot .quitar:hover{color:var(--sangre)}
.miniatura{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}

/* cuerpo de la hoja */
.hoja-cuerpo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.hoja-col{padding:var(--s3);min-width:0}
.hoja-col+.hoja-col{border-left:1px solid var(--linea)}
.radar{width:100%;max-width:300px;margin:var(--s2) auto var(--s3);display:block}
.radar .malla{stroke:var(--linea);fill:none;stroke-width:1}
.radar .eje{stroke:var(--linea);stroke-width:1}
.radar .forma{fill:rgba(168,31,53,.24);stroke:var(--oro);stroke-width:1.4;stroke-linejoin:round}
.radar .punto{fill:var(--oro-vivo)}
.radar text{font-family:'Barlow Condensed';font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;fill:var(--tinta-3)}
.detalle-lista{list-style:none;padding:0;margin:0}
.detalle-lista li{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);
  padding:7px 0;border-bottom:1px solid var(--linea)}
.detalle-lista li:last-child{border-bottom:0}
.detalle-lista b{font-size:11px;color:var(--tinta-2);font-weight:500}
.detalle-lista span{font-family:'Barlow Condensed';font-size:16px;color:var(--oro-vivo);
  line-height:1;font-variant-numeric:tabular-nums}

/* buffs */
.franja-buff{display:flex;align-items:center;gap:var(--s2);border:1px solid var(--linea);
  background:var(--hueco);padding:10px var(--s2);border-radius:var(--r)}
.franja-buff.viva{border-color:rgba(168,31,53,.45);
  background:linear-gradient(100deg,rgba(168,31,53,.16),var(--hueco) 70%)}
.franja-buff .aro{width:28px;height:28px;flex:none;border-radius:50%;border:1px solid var(--aurora);
  display:grid;place-items:center;font-family:'Cormorant Garamond',serif;color:var(--oro-vivo);font-size:14px}
.franja-buff .aro.apagado{border-color:var(--linea);color:var(--tinta-3)}
.franja-buff b{display:block;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:17px;
  color:var(--oro-vivo);line-height:1.1}
.franja-buff .aro.apagado+div b{color:var(--tinta-3)}
.franja-buff span{display:block;font-size:11.5px;color:var(--tinta-2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.franja-buff .reloj{font-size:17px}

/* arcón */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:var(--s1);margin-bottom:var(--s1);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:transparent;border:1px solid var(--linea);color:var(--tinta-3);
  font-size:10.5px;padding:5px 10px;border-radius:var(--r);cursor:pointer;
  display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.16s}
.chip:hover{border-color:var(--linea-viva);color:var(--tinta-2)}
.chip i{font-style:normal;font-size:9.5px;opacity:.75}
.chip.on{border-color:rgba(192,162,74,.5);color:var(--oro-vivo);background:rgba(192,162,74,.08)}
.arcon{contain:paint;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;max-height:212px;overflow-y:auto;
  padding:6px;border:1px solid var(--linea);border-radius:var(--r);background:var(--hueco)}
.arcon::-webkit-scrollbar{width:5px}
.arcon::-webkit-scrollbar-thumb{background:var(--linea-viva);border-radius:3px}
.celda{aspect-ratio:1;border:1px solid var(--linea);background:var(--carta);border-radius:var(--r);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px;
  cursor:grab;color:var(--tinta-3);position:relative;overflow:hidden;transition:.14s}
.celda:hover{border-color:var(--linea-viva);color:var(--tinta-2)}
.celda svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.3;position:relative;z-index:1}
.celda .et{font-size:8.5px;letter-spacing:.06em;line-height:1.1;text-align:center;max-width:100%;
  position:relative;z-index:1;text-shadow:0 1px 3px rgba(10,9,16,.95);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.celda.eq{border-color:rgba(192,162,74,.45);color:var(--oro-vivo)}
.celda.eq::after{content:"";position:absolute;top:4px;right:4px;width:4px;height:4px;border-radius:50%;
  background:var(--oro);z-index:2}
.celda.sel{border-color:var(--aurora);color:var(--tinta)}
.celda.tomado{opacity:.4}
.celda.hueca{border-style:dashed;color:var(--linea-viva);font-family:'Barlow Condensed';font-size:16px;cursor:pointer}
.celda.hueca:hover{color:var(--oro)}
.zona-inv.sobre{border-color:var(--sangre)}
.efectos{border:1px solid var(--linea);border-radius:var(--r);background:var(--hueco);overflow:hidden}
.efecto{display:flex;gap:var(--s2);align-items:flex-start;padding:10px var(--s2);
  border-bottom:1px solid var(--linea)}
.efecto:last-child{border-bottom:0}
.efecto-o{width:34px;height:34px;flex:none;border:1px solid rgba(192,162,74,.4);border-radius:var(--r);
  overflow:hidden;display:grid;place-items:center;background:var(--carta)}
.efecto-o img{width:100%;height:100%;object-fit:cover}
.efecto-o .runa{color:var(--oro);font-size:14px}
.efecto b{display:block;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:16px;
  color:var(--oro-vivo);line-height:1.2}
.efecto i{display:block;font-family:'Barlow Condensed';font-style:normal;font-size:9.5px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--aurora);margin-top:2px}
.efecto p{font-size:12.5px;color:var(--tinta-2);margin-top:5px;line-height:1.45;overflow-wrap:anywhere}
.efecto b,.detalle-lista b{overflow-wrap:anywhere}
.nota-efectos{font-family:'Barlow Condensed';font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--tinta-3);margin-top:8px}
.ficha{border:1px solid var(--linea-viva);background:var(--carta);padding:var(--s3);
  border-radius:var(--r);margin-top:var(--s2)}
.ficha-img{width:100%;max-height:170px;object-fit:cover;border-radius:var(--r);margin-bottom:var(--s2);display:block}
.rareza{font-size:10px;color:var(--oro)}
.tipo-tag{font-size:10px;color:var(--aurora)}
.pista{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);
  border:1px solid rgba(168,31,53,.45);background:rgba(168,31,53,.10);
  padding:9px var(--s2);border-radius:var(--r);margin:0 var(--s3) var(--s3);font-size:11px;color:var(--tinta)}

/* ---------- objetos (ficha larga) ---------- */
.objeto{display:flex;gap:var(--s2);align-items:flex-start;border:1px solid var(--linea);
  background:var(--carta);padding:var(--s3);border-radius:var(--r);margin-bottom:var(--s2)}
.medalla{width:38px;height:38px;flex:none}

/* ---------- formularios ---------- */
input,textarea,select{width:100%;background:var(--hueco);border:1px solid var(--linea);color:var(--tinta);
  padding:9px 11px;font-family:'Barlow',sans-serif;font-size:14px;border-radius:var(--r)}
textarea{resize:vertical;min-height:66px;line-height:1.5}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--aurora);outline-offset:1px}
label{display:block;margin:var(--s2) 0 5px}
label span{font-family:'Barlow Condensed';text-transform:uppercase;letter-spacing:.18em;
  font-size:10.5px;color:var(--tinta-2)}
.btn{background:transparent;border:1px solid var(--linea);color:var(--tinta-2);padding:8px 14px;
  cursor:pointer;font-size:11px;border-radius:var(--r);transition:.16s;line-height:1.2}
.btn:hover{border-color:var(--linea-viva);color:var(--tinta)}
.btn.oro{border-color:rgba(192,162,74,.55);color:var(--oro-vivo)}
.btn.oro:hover{border-color:var(--oro);background:rgba(192,162,74,.10)}
.btn.rojo:hover{border-color:#E0788A;color:#E0788A}
.btn-fila{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--s2)}
.fila-img{display:flex;gap:var(--s2);align-items:flex-start;margin-top:var(--s2)}
#vistaImg{width:84px;height:84px;flex:none;border:1px dashed var(--linea);border-radius:var(--r);
  display:grid;place-items:center;background-size:cover;background-position:center;cursor:pointer;
  font-family:'Barlow Condensed';font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--tinta-3);text-align:center;padding:6px}
#vistaImg.con-img{border-style:solid;border-color:rgba(192,162,74,.45);color:transparent}

.aliados-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.aliado-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linea);
  background:var(--carta);border-radius:999px;padding:4px 11px 4px 4px;font-size:12px;color:var(--tinta)}
.aliado-chip i{width:20px;height:20px;border-radius:50%;background:rgba(168,31,53,.22);
  border:1px solid rgba(168,31,53,.5);display:grid;place-items:center;font-style:normal;
  font-family:'Barlow Condensed';font-size:11px;color:var(--tinta)}
.aliado-chip.nodo-chip{padding:4px 11px;font-family:'Barlow Condensed';text-transform:uppercase;
  letter-spacing:.14em;font-size:10.5px;color:var(--oro-vivo);border-color:rgba(192,162,74,.4)}
.aliados-lista{display:grid;gap:6px;margin-top:6px}
.aliado-fila{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--linea);
  background:var(--carta);border-radius:var(--r);padding:9px 11px;cursor:pointer;text-align:left;
  color:inherit;font:inherit;transition:.14s;width:100%}
.aliado-fila:hover{border-color:var(--linea-viva)}
.aliado-fila.estatico{cursor:default}
.aliado-fila i{width:24px;height:24px;flex:none;border-radius:50%;background:rgba(168,31,53,.2);
  border:1px solid rgba(168,31,53,.5);display:grid;place-items:center;font-style:normal;
  font-family:'Barlow Condensed';font-size:12px;color:var(--tinta)}
.aliado-fila b{display:block;font-size:14px;font-weight:500}
.aliado-fila u{display:block;text-decoration:none;font-size:12px;color:var(--tinta-3);
  line-height:1.4;margin-top:2px}
.check-bloque{margin-top:var(--s2)}
.check-bloque .check{margin:0}
.check-bloque input[id^=rol_]{border-top:0;border-radius:0 0 var(--r) var(--r);font-size:13px;padding:8px 11px}
.check{display:flex;align-items:center;gap:10px;border:1px solid var(--linea);border-radius:var(--r);
  padding:10px var(--s2);margin:6px 0 0;cursor:pointer;background:var(--hueco)}
.check input{width:16px;height:16px;flex:none;accent-color:var(--aurora)}
.check span b{display:block;font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--tinta)}
.check span i{display:block;font-family:'Barlow Condensed';font-style:normal;font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--aurora);margin-top:2px}

/* ---------- pactos ---------- */
.pacto h3{font-size:21px}
.vinculo{font-size:10px;color:var(--aurora);margin-top:4px}
.campo{margin-top:var(--s2)}
.campo b{display:block;font-size:10px;color:var(--tinta-3);margin-bottom:3px;font-weight:500}
.campo p{font-size:13.5px;white-space:pre-wrap}
.limite{border-left:2px solid var(--sangre);padding-left:10px}

/* ---------- pactos: sistema solar ---------- */
.sistema{position:relative;width:100%;aspect-ratio:1;max-width:560px;margin:var(--s2) auto var(--s3);
  background:radial-gradient(38% 38% at 50% 50%,rgba(192,162,74,.10),transparent 70%)}
.orbitas{position:absolute;inset:0;width:100%;height:100%}
.orbitas circle{fill:none;stroke:var(--linea);stroke-width:.25;vector-effect:non-scaling-stroke}
.sol{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:19%;aspect-ratio:1;
  border-radius:50%;border:1px solid rgba(192,162,74,.55);overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,rgba(192,162,74,.28),var(--hueco) 74%);
  color:var(--oro-vivo);font-family:'Cormorant Garamond',serif;font-size:26px;
  box-shadow:0 0 30px rgba(192,162,74,.18)}
.sol img{width:100%;height:100%;object-fit:cover}
.planeta{position:absolute;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;border-radius:50%;
  border:1px solid var(--linea);background:radial-gradient(circle at 50% 30%,var(--carta),var(--hueco) 78%);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;padding:4px;transition:.18s;color:var(--tinta-2)}
.planeta:hover{transform:translate(-50%,-50%) scale(1.1);color:var(--tinta)}
.planeta .ini{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--tinta);line-height:1}
.planeta b{font-family:'Barlow Condensed';font-weight:500;font-size:8px;letter-spacing:.1em;
  text-transform:uppercase;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.planeta.orb1{border-color:rgba(192,162,74,.55);box-shadow:0 0 18px rgba(192,162,74,.14);width:17%}
.planeta.orb2{border-color:rgba(168,31,53,.45)}
.planeta.orb3{border-color:var(--linea);opacity:.9;width:13%}
.planeta{touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
.planeta.agarrado{transform:translate(-50%,-50%) scale(1.14);z-index:5;cursor:grabbing;
  box-shadow:0 0 26px rgba(168,31,53,.35);transition:none}
.planeta.grande{position:relative;transform:none;width:64px;height:64px;flex:none}
.planeta.grande:hover{transform:none}
.leyenda{display:flex;justify-content:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s3)}
.leyenda span{display:inline-flex;align-items:center;gap:6px;font-family:'Barlow Condensed';
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--tinta-3)}
.leyenda i{width:8px;height:8px;border-radius:50%;border:1px solid var(--linea)}
.leyenda i.o1{border-color:rgba(192,162,74,.7)}
.leyenda i.o2{border-color:rgba(168,31,53,.6)}
.cabeza-pacto{display:flex;gap:var(--s3);align-items:center}
.cabeza-pacto h2{font-size:28px}
.secciones{margin-top:var(--s3);display:grid;gap:var(--s1)}
.seccion{border:1px solid var(--linea);border-radius:var(--r);background:var(--hueco);overflow:hidden}
.seccion summary{cursor:pointer;padding:12px var(--s3);font-family:'Barlow Condensed';font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--tinta-2);list-style:none}
.seccion summary::-webkit-details-marker{display:none}
.seccion summary::after{content:"+";float:right;color:var(--tinta-3)}
.seccion[open] summary{color:var(--oro-vivo);border-bottom:1px solid var(--linea)}
.seccion[open] summary::after{content:"−"}
.seccion.limites summary{color:#E0788A}
.seccion.limites{border-left:2px solid var(--sangre)}
.texto{padding:var(--s3);font-size:13.5px;line-height:1.6;color:var(--tinta-2)}
.texto h4{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--tinta);margin:var(--s3) 0 6px;font-weight:600}
.texto h4:first-child{margin-top:0}
.texto p{margin:0 0 8px}
.texto li{margin:0 0 6px 18px}
.texto b{color:var(--tinta)}

/* ---------- nodos: constelación ---------- */
.constelacion{position:relative;width:100%;aspect-ratio:1;max-width:560px;margin:var(--s2) auto var(--s4);
  border:0;background:radial-gradient(46% 46% at 50% 50%,rgba(168,31,53,.13),transparent 72%)}
.hilos{position:absolute;inset:0;width:100%;height:100%}
.hilos line{stroke:var(--linea);stroke-width:.35;vector-effect:non-scaling-stroke}
.hilos line.vivo{stroke:rgba(192,162,74,.5)}
.nodo-ancla{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:29%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(192,162,74,.5);
  background:radial-gradient(circle at 50% 35%,rgba(192,162,74,.16),var(--hueco) 72%);
  color:var(--oro-vivo);cursor:pointer;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;padding:6px;transition:.18s;z-index:2}
.nodo-ancla:hover{border-color:var(--oro);transform:translate(-50%,-50%) scale(1.04)}
.nodo-ancla .glifo{font-size:15px;opacity:.85}
.nodo-ancla b{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;line-height:1.05;text-align:center}
.nodo-ancla i{font-family:'Barlow Condensed';font-style:normal;font-size:10px;letter-spacing:.16em;color:var(--tinta-2)}
.nodo-ancla.cerrado{border-color:var(--oro);background:radial-gradient(circle at 50% 35%,rgba(192,162,74,.3),var(--hueco) 74%)}
.nodo-ancla.irradia{box-shadow:0 0 0 1px rgba(168,31,53,.35),0 0 34px rgba(168,31,53,.28)}
.nodo-orbe{position:absolute;transform:translate(-50%,-50%);width:23%;aspect-ratio:1;border-radius:50%;
  border:1px solid var(--linea);background:radial-gradient(circle at 50% 30%,var(--carta),var(--hueco) 78%);color:var(--tinta-2);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;
  transition:.18s;z-index:2}
.nodo-orbe:hover{border-color:var(--aurora);color:var(--tinta);transform:translate(-50%,-50%) scale(1.06)}
.nodo-orbe .sigla{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--tinta);line-height:1}
.nodo-orbe b{font-family:'Barlow Condensed';font-weight:500;font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;line-height:1.1;text-align:center;max-width:100%;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nodo-orbe i{font-family:'Barlow Condensed';font-style:normal;font-size:9px;letter-spacing:.14em;color:var(--tinta-3)}

.logo-orbe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;opacity:.92}
.nodo-orbe{overflow:hidden}
.nodo-orbe b,.nodo-orbe i{position:relative;z-index:1;text-shadow:0 1px 4px rgba(10,9,16,.95)}
.nodo-orbe:has(.logo-orbe) b{margin-top:auto}
.nodo-orbe:has(.logo-orbe)::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(to top,rgba(10,9,16,.85),transparent 62%)}

.nodo-orbe{touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
.nodo-orbe.agarrado{transform:translate(-50%,-50%) scale(1.1);z-index:6;cursor:grabbing;transition:none;
  border-color:var(--oro);box-shadow:0 0 26px rgba(192,162,74,.28)}
.nodo-orbe.listo,.planeta.listo{outline:1px solid var(--oro);outline-offset:3px}
.nodo-orbe.hueco-destino{border-style:dashed;border-color:var(--aurora);opacity:.6}

.giro{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}
.constelacion .nodo-orbe.agarrado{transform:translate(-50%,-50%) scale(1.1)}
@media (prefers-reduced-motion:reduce){.giro{transform:none!important}}

/* ventana de nodo */
.cabeza-nodo{display:flex;gap:var(--s3);align-items:flex-start}
.escudo{width:72px;height:72px;flex:none;border:1px solid var(--linea);border-radius:var(--r);
  background:var(--hueco);cursor:pointer;overflow:hidden;display:grid;place-items:center;
  color:var(--tinta-3);font-family:'Cormorant Garamond',serif;font-size:26px;transition:.16s;padding:0}
.escudo:hover{border-color:var(--oro);color:var(--oro-vivo)}
.escudo img{width:100%;height:100%;object-fit:cover}
.escudo.con-logo{border-color:rgba(192,162,74,.45)}

.ventana{padding-top:var(--s3)}
.ventana-barra{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);
  padding-bottom:var(--s2);border-bottom:1px solid var(--linea)}
.ventana-cuerpo{border:1px solid var(--linea);border-top:0;border-radius:0 0 var(--r) var(--r);
  background:var(--carta);padding:var(--s4);min-height:60vh}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);
  border:1px solid var(--linea);border-radius:var(--r);background:var(--hueco);padding:var(--s3)}
.etapas{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
@media(max-width:640px){.tres,.etapas{grid-template-columns:1fr}.ventana-cuerpo{padding:var(--s3)}}

/* franja del manto dentro del anclaje */
.manto-en-nodo{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);
  border:1px solid rgba(168,31,53,.4);background:linear-gradient(100deg,rgba(168,31,53,.14),var(--carta) 70%);
  padding:var(--s2) var(--s3);border-radius:var(--r);margin-top:var(--s3)}
.manto-en-nodo b{display:block;font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--oro-vivo)}
.manto-en-nodo b.apagado{color:var(--tinta-3)}
.manto-en-nodo span{display:block;font-size:12px;color:var(--tinta-2);margin-top:2px}
.manto-en-nodo .reloj{font-size:20px}

/* ---------- nodos ---------- */
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s2)}
.nodo{background:var(--carta);border:1px solid var(--linea);padding:var(--s3);cursor:pointer;
  border-radius:var(--r);text-align:left;color:inherit;font:inherit;transition:.16s}
.nodo:hover{border-color:var(--linea-viva)}
.nodo h3{font-size:20px;margin-bottom:6px}
.prog{font-size:10px;color:var(--tinta-3)}
.prog i{color:var(--oro-vivo);font-style:normal}
.etapa{border:1px solid var(--linea);padding:var(--s3);margin-bottom:var(--s1);border-radius:var(--r);background:var(--carta)}
.etapa.completa{border-color:rgba(63,125,98,.5)}
.etapa-t{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);margin-bottom:var(--s1)}
.mov{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.mov .marca{width:15px;height:15px;flex:none;border:1px solid var(--tinta-3);margin-top:3px;border-radius:2px;position:relative}
.mov.hecho .marca{background:var(--savia);border-color:var(--savia)}
.mov.hecho .marca::after{content:"";position:absolute;left:4.5px;top:1px;width:3.5px;height:8px;
  border:solid var(--fondo);border-width:0 2px 2px 0;transform:rotate(42deg)}
.mov.hecho span{color:var(--tinta-3);text-decoration:line-through}
.mov span{font-size:13.5px}

.mov{align-items:center}
.mov span{flex:1;min-width:0}
.arco-btn{flex:none;width:22px;height:22px;border-radius:var(--r);border:1px dashed var(--linea);
  background:transparent;color:var(--tinta-3);font-family:'Barlow Condensed';font-size:11px;
  cursor:pointer;line-height:1;transition:.16s}
.arco-btn:hover{border-color:var(--oro);color:var(--oro-vivo)}
.arco-btn.lleno{border-style:solid;border-color:rgba(192,162,74,.5);color:var(--oro-vivo)}
.recompensa{border:1px solid rgba(192,162,74,.4);background:linear-gradient(120deg,rgba(192,162,74,.12),var(--hueco) 70%);
  border-radius:var(--r);padding:var(--s2) var(--s3);margin-top:var(--s3)}
.recompensa b{font-family:'Barlow Condensed';font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro)}
.recompensa p{font-size:14px;margin-top:4px}
.tira{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:var(--s3)}
.tira img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--linea);border-radius:var(--r);cursor:zoom-in}
.tira-edit{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.vineta{aspect-ratio:1;border:1px dashed var(--linea);border-radius:var(--r);background:var(--hueco);
  background-size:cover;background-position:center;cursor:pointer;position:relative;padding:0}
.vineta i{position:absolute;top:4px;left:6px;font-style:normal;font-family:'Barlow Condensed';
  font-size:11px;color:var(--tinta-3);text-shadow:0 1px 3px rgba(10,9,16,.9)}
.vineta.con{border-style:solid;border-color:rgba(192,162,74,.45)}
.vineta.con i{color:var(--oro-vivo)}
@media(max-width:520px){.tira,.tira-edit{grid-template-columns:repeat(2,1fr)}}

/* ---------- tesorería ---------- */
.arcas{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s1);margin-top:var(--s3)}
.arca{border:1px solid var(--linea);background:var(--carta);border-radius:var(--r);padding:var(--s2)}
.arca b{display:block;font-family:'Barlow Condensed';font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--tinta-3)}
.arca span{display:block;font-family:'Barlow Condensed';font-size:19px;color:var(--tinta);margin-top:4px;
  font-variant-numeric:tabular-nums;line-height:1.1}
.arca span.verde{color:var(--savia)}
.arca span.rojo{color:#E0788A}
.arca.destacada{border-color:rgba(192,162,74,.45);background:linear-gradient(150deg,rgba(192,162,74,.12),var(--carta) 70%)}
.arca.destacada span{color:var(--oro-vivo)}
.retornos{display:grid;gap:var(--s2)}
.retorno{border:1px solid var(--linea);background:var(--carta);border-radius:var(--r);padding:var(--s2) var(--s3)}
.retorno-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.retorno-t b{font-family:'Cormorant Garamond',serif;font-size:17px}
.retorno-t i{font-family:'Barlow Condensed';font-style:normal;font-size:11px;letter-spacing:.16em;color:var(--oro-vivo)}
.libro{border:1px solid var(--linea);border-radius:var(--r);overflow:hidden;background:var(--carta)}
.asiento{display:flex;align-items:center;gap:var(--s2);padding:11px var(--s3);cursor:pointer;
  border-bottom:1px solid var(--linea);border-left:2px solid transparent;transition:.14s}
.asiento:last-child{border-bottom:0}
.asiento:hover{background:var(--hueco)}
.asiento.inversion{border-left-color:var(--aurora)}
.asiento.ingreso{border-left-color:var(--savia)}
.asiento.gasto{border-left-color:var(--sangre)}
.asiento-f{font-family:'Barlow Condensed';font-size:11px;letter-spacing:.1em;color:var(--tinta-3);
  width:66px;flex:none;font-variant-numeric:tabular-nums}
.asiento b{display:block;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asiento i{display:block;font-family:'Barlow Condensed';font-style:normal;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-3);margin-top:2px}
.asiento-m{font-family:'Barlow Condensed';font-size:16px;color:var(--tinta);flex:none;
  font-variant-numeric:tabular-nums}
.asiento.ingreso .asiento-m{color:var(--savia)}
.asiento.gasto .asiento-m{color:#E0788A}
@media(max-width:600px){.arcas{grid-template-columns:repeat(2,1fr)}}

/* ---------- biblioteca ---------- */
.estantes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--s2)}
.tomo{display:flex;gap:var(--s2);align-items:stretch;border:1px solid var(--linea);background:var(--carta);
  border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;text-align:left;color:inherit;transition:.16s}
.tomo:hover{border-color:var(--linea-viva)}
.tomo.sellado{border-color:rgba(192,162,74,.4)}
.tomo-img{width:76px;flex:none;background:var(--hueco);display:grid;place-items:center;color:var(--oro);position:relative}
.tomo-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tomo-t{padding:var(--s2);min-width:0;display:flex;flex-direction:column;justify-content:center}
.tomo-t b{font-family:'Cormorant Garamond',serif;font-size:17px;line-height:1.15;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tomo-t i{font-family:'Barlow Condensed';font-style:normal;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--aurora);margin-top:4px}
.tomo-t u{font-family:'Barlow Condensed';text-decoration:none;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tinta-3);margin-top:2px}

/* ---------- el claro ---------- */
.proximo{border:1px solid rgba(63,125,98,.45);background:linear-gradient(100deg,rgba(63,125,98,.14),var(--carta) 70%);
  border-radius:var(--r);padding:var(--s2) var(--s3);margin-top:var(--s3)}
.proximo b{font-family:'Barlow Condensed';font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--savia)}
.proximo div{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:5px}
.proximo span{font-size:13.5px;color:var(--tinta)}
.actos{display:grid;gap:6px}
.acto{display:flex;align-items:center;gap:var(--s2);border:1px solid var(--linea);background:var(--carta);
  border-radius:var(--r);padding:10px var(--s2)}
.acto.agendado{border-color:rgba(63,125,98,.4)}
.acto b{display:block;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acto i{display:block;font-family:'Barlow Condensed';font-style:normal;font-size:10px;letter-spacing:.14em;

.mini-chip.on{border-color:rgba(201,166,63,.55);color:var(--oro-vivo);background:rgba(201,166,63,.10)}
@media(max-width:520px){.anc-stats{padding-left:0}}

/* ---------- capas ---------- */
.velo{position:fixed;inset:0;background:rgba(6,5,11,.88);z-index:40;display:flex;align-items:flex-start;
  justify-content:center;padding:var(--s4) var(--s3);overflow-y:auto}
.velo-caja{background:var(--carta);border:1px solid var(--linea);max-width:620px;width:100%;
  padding:var(--s4);border-radius:var(--r);margin:auto}
/* lupa: la viñeta a pantalla completa, con zoom al tocarla */
.lupa-caja{max-width:100%;max-height:84vh;overflow:auto;margin:auto;-webkit-overflow-scrolling:touch}
.lupa-img{display:block;max-width:100%;max-height:84vh;object-fit:contain;margin:auto;
  border-radius:var(--r);cursor:zoom-in;image-rendering:auto}
.lupa-img.zoom{max-width:none;max-height:none;width:auto;height:auto;cursor:zoom-out}
.lupa-pie{position:fixed;left:0;right:0;bottom:0;display:flex;gap:var(--s1);justify-content:center;
  align-items:center;flex-wrap:wrap;padding:var(--s2);background:linear-gradient(transparent,rgba(6,5,11,.9) 40%)}
.lupa-info{font-family:'Barlow Condensed';font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tinta-3)}
.lupa-info.floja{color:var(--oro)}
.archivo-fila{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:6px;
  border:1px dashed var(--linea);border-radius:var(--r);padding:10px var(--s2);background:var(--hueco)}
.archivo-fila b{font-family:'Barlow Condensed';font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--oro-vivo)}
.archivo-fila span{font-size:11px;color:var(--tinta-3);flex:1;min-width:120px;overflow-wrap:anywhere}
#aviso{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:70;background:var(--carta);
  border:1px solid var(--sangre);color:var(--tinta);padding:10px 16px;border-radius:var(--r);
  font-family:'Barlow Condensed';font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  max-width:90vw;text-align:center;animation:aparecer .2s ease}
#consagracion{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 50%,rgba(168,31,53,.32),rgba(6,5,11,.97) 66%);
  text-align:center;padding:var(--s4);animation:aparecer .8s ease}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
#consagracion h2{font-size:42px;color:var(--oro-vivo)}
#consagracion p{color:var(--tinta);max-width:36ch;margin:var(--s2) auto var(--s4)}

/* ---------- adaptación ---------- */
@media(max-width:720px){
  .hoja-cuerpo{grid-template-columns:1fr}
  .hoja-col+.hoja-col{border-left:0;border-top:1px solid var(--linea)}
}
@media(max-width:600px){
  .camara{grid-template-columns:1fr;gap:var(--s2)}
  .col-slots{grid-auto-rows:auto;grid-template-columns:repeat(5,1fr)}
  .col-slots .slot{aspect-ratio:1}
  .retrato{min-height:0;aspect-ratio:3/4}
  .titulo h2{font-size:24px}
  .hoja-id h2{font-size:26px}
  .reloj{font-size:22px}
}
#btnSync{min-width:38px;padding:6px 8px;font-size:13px;letter-spacing:0}
#btnSync[data-s="ok"]{color:#5FBF8B;border-color:rgba(95,191,139,.4)}
#btnSync[data-s="sync"]{color:var(--oro-vivo);border-color:rgba(239,211,122,.45)}
#btnSync[data-s="mal"]{color:#E0656B;border-color:rgba(224,101,107,.5)}
#btnSync[data-s="off"]{color:var(--tinta-3)}
#btnSync[data-s="sync"]{animation:latir 1s linear infinite}
@keyframes latir{50%{opacity:.35}}
.linea-nube{display:flex;gap:var(--s1);align-items:center;flex-wrap:wrap;margin-top:var(--s1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  async leer(k){
    try{ if(window.storage){const r=await window.storage.get(k); return r? JSON.parse(r.value):null;} }catch(e){}
    try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; }
  },
  async escribir(k,v){
    const s=JSON.stringify(v);
    try{ if(window.storage){ await window.storage.set(k,s); return true; } }catch(e){}
    try{ localStorage.setItem(k,s); return true; }catch(e){ return false; }   // se llenó el equipo

function rachas(){
  const s=new Set(E.diario||[]);
  let actual=0, ref=s.has(hoy())?hoy():menosDias(hoy(),1);
  while(s.has(ref)){ actual++; ref=menosDias(ref,1); }
  let mejor=0;
  [...s].sort().forEach(f=>{ let n=1,p=menosDias(f,1); while(s.has(p)){n++;p=menosDias(p,1);} mejor=Math.max(mejor,n); });
  return {actual,mejor,total:s.size};
}

const idEstable=(pre,txt)=>pre+'-'+(txt||'x').toLowerCase()

async function cargar(){
  const g=await Guardado.leer(CLAVE);
  E=g?{...structuredClone(INICIAL),...g}:structuredClone(INICIAL);

    if(m.recompensa===undefined) m.recompensa='';
    if(!Array.isArray(m.vinetas)) m.vinetas=[];
    if(m.pdf===undefined) m.pdf=null;
  })));
  if(!Array.isArray(E.diario)) E.diario=[];
  if(typeof E.xp!=='number') E.xp=0;
  if(!E.anclajesV2){ E.rituales=structuredClone(INICIAL.rituales); E.hechos=[]; E.anclajesV2=true; }
  if(E.sigilo===undefined||E.sigilo==='') E.sigilo=ESCUDO;
  if(typeof E.mantos!=='number') E.mantos=0;
  if(!E.horizonte||!Array.isArray(E.horizonte.visiones)) E.horizonte={visiones:[],figuras:[]};
  if(!Array.isArray(E.horizonte.figuras)) E.horizonte.figuras=[];

  if(!Array.isArray(E.tesoreria)) E.tesoreria=[];
  if(!Array.isArray(E.actos)) E.actos=structuredClone(INICIAL.actos);

    E.habilidades.forEach(x=>{
      if(/deporte/i.test(x.nombre)) x.nombre='Natación';
      x.sesiones=[];
    });
    E.reinicioHab=true;
  }
  if(!E.habilidades.some(x=>x.nombre.toLowerCase().includes('marketing')))
    E.habilidades.push(structuredClone(INICIAL.habilidades.find(x=>x.id==='h3')));
  E.nodos.forEach(n=>n.etapas.forEach(e=>{
    if(e.archivada===undefined) e.archivada=false;
    if(e.botin===undefined) e.botin=null;
    if(!e.arco||typeof e.arco!=='object') e.arco=arcoVacio();
    if(!Array.isArray(e.arco.vinetas)) e.arco.vinetas=[];
    if(typeof e.arco.nota!=='string') e.arco.nota='';
    if(e.arco.pdf===undefined) e.arco.pdf=null;
  }));
  if(!E.semillaBianca&&!E.pactos.some(p=>/bianca/i.test(p.nombre))){
    E.pactos.push({id:'p-bianca',nombre:'Bianca',
      vinculo:'Prima · aliada en Fambit',arquetipo:'',
      esencia:'Prima, aliada en Fambit y la unica con quien la regla es autenticidad total.',
      orbita:2,pienso:'Prima, aliada en Fambit y una de las personas con las que la relacion no admite adornos.\n\nPregunta hasta el fondo: interrumpe, insiste, vuelve sobre lo mismo. Eso, cuando no lo tomo como ataque, es su manera de tomarme en serio. No le interesa la version pulida, le interesa saber si lo que digo se sostiene. La gente a la que no le importa no interroga: asiente y sigue.\n\nEmpuja hacia mi independencia. Su insistencia con Fambit, Promo-Bello y la joyeria apunta a lo mismo: que sostenga lo mio sin depender de nadie. Cuando presiona con eso no esta desconfiando, esta exigiendo.\n\nVive lejos, asi que el contacto es intencional o no ocurre.',interactuar:'### Autenticidad total\n\nCon ella la regla es verdad sin adornos, en las dos direcciones. No maquillo avances, no digo que algo va bien cuando no va. A cambio recibo lo mismo sin filtro.\n\n### Traer hechos, no impresiones\n\nSu pregunta se calma cuando hay algo concreto. **"Vamos bien"** abre diez preguntas mas. **"Esto se hizo, esto no, esto esta trabado por X"** cierra el tema.\n\n### Reconocer lo que empuja\n\nCuando insiste con mis proyectos propios no esta dudando de mi: esta exigiendome que sostenga lo mio.\n\n### Distancia y presencia\n\nBuscarla no es un favor que le hago. Es lo que mantiene el vinculo vivo.\n\n### Regla con Bianca\n\n**Verdad sin adornos + hechos concretos + firmeza al ser preguntado.**',limites:'# Limite del Interrogatorio\n\nBianca a veces pregunta en cadena: pregunta, interrumpe, vuelve a preguntar lo mismo con otra forma. No siempre busca el dato, busca ver si el centro de la persona se sostiene bajo presion.\n\n**Mi limite no es que ella deje de preguntar. Es que yo no me altere respondiendo.**\n\n- Respondo con la verdad y con calma, aunque me pregunten lo mismo tres veces. La verdad no cambia de forma por repetirse.\n- No acelero, no me justifico de mas, no relleno el silencio. Si me quede sin que anadir: **"Ya te dije lo que se. No tengo nada distinto que agregar."**\n- No confundo ponerme nervioso con estar en falta. El cuerpo se acelera igual bajo presion que bajo culpa.\n- Si la ronda deja de buscar entender y empieza a desarmar, lo nombro sin acusar: **"Siento que esto dejo de ser conversacion. Retomemoslo con calma."**\n- No respondo desde el enojo ni desde la prisa por que se acabe. Si hace falta, corto y vuelvo despues.\n\n**El interrogatorio revela el centro de una persona. Que revele el mio firme, no el mio roto.**'});
    E.semillaBianca=true;
  }
  E.pactos.forEach(p=>{ if(!p.id) p.id=idEstable('p',p.nombre);
    if(!p.orbita) p.orbita=2; if(p.arquetipo===undefined) p.arquetipo=''; if(p.esencia===undefined) p.esencia=''; });
  E.nodos.forEach((n,i)=>{ if(!n.id) n.id='n'+i; });
  E.nodos.forEach(n=>{
    if(typeof n.aliados==='string'){ n.notaAliados=n.aliados; n.aliados=[]; }
    if(!Array.isArray(n.aliados)) n.aliados=[];
    if(!n.roles||typeof n.roles!=='object') n.roles={};
    if(n.notaAliados===undefined) n.notaAliados='';
  });
  const viejos=['COSMO','Fambit','Promo-Bello','Santuario Verde','Nodo sin nombre'];
  E.nodos.forEach((n,i)=>{                       // renombrar solo los que siguen vacíos
    const intacto=!n.vision&&!(n.aliados||[]).length&&!n.notaAliados&&!n.recursos&&n.etapas.every(e=>e.movimientos.every(m=>!m.t));
    if(intacto&&viejos.includes(n.nombre)&&PROYECTOS[i]) n.nombre=PROYECTOS[i];
  });

    if(o.slot!==undefined){ o.tipo=o.slot; o.equipado=!!o.slot; delete o.slot; }
    if(o.tipo===undefined) o.tipo='';
  });
  if(E.dia!==hoy()){
    if(E.hechos.length===E.rituales.length&&E.dia) E.racha++;
    else if(E.dia) E.racha=0;
    E.dia=hoy(); E.hechos=[];
  }
  refrescarSombra();
  pintar();
  iniciarNube();

/* Cada clave de primer nivel lleva su propia marca de tiempo (E._m).
   Así dos equipos pueden editar cosas distintas sin pisarse: al fusionar
   gana la versión más reciente de CADA clave, no el último que subió. */
const IGNORA=new Set(['_m','_mi','_x','firebase','nubeUlt']);
let sombra=null, sombraIt=null;
const jsonDe=x=>{ try{ return JSON.stringify(x); }catch(e){ return ''; } };
function refrescarSombra(){
  sombra={}; sombraIt={};
  if(!E) return;
  Object.keys(E).forEach(k=>{
    if(IGNORA.has(k)) return;
    sombra[k]=jsonDe(E[k]);
    if(listaFusionable(E[k])){ const m={}; E[k].forEach(x=>m[claveDe(x)]=jsonDe(x)); sombraIt[k]=m; }
  });
}
function sellarCambios(){
  if(!E) return;
  if(!E._m||typeof E._m!=='object') E._m={};
  if(!E._mi||typeof E._mi!=='object') E._mi={};
  if(!E._x||typeof E._x!=='object') E._x={};
  if(sombra===null){ refrescarSombra(); return; }   // arranque: no inventamos marcas
  const ahora=Date.now();
  Object.keys(E).forEach(k=>{
    if(IGNORA.has(k)) return;
    const t=jsonDe(E[k]);
    if(sombra[k]===t) return;
    sombra[k]=t; E._m[k]=ahora;                     // la sección cambió (sirve para detectar borrados)
    if(listaFusionable(E[k])){                      // ...y además, qué elemento exacto cambió
      const prev=sombraIt[k]||{}, ahoraIt={}, marcas=E._mi[k]||(E._mi[k]={});
      const lapidas=E._x[k]||(E._x[k]={});
      E[k].forEach(x=>{
        const id=claveDe(x), j=jsonDe(x);
        ahoraIt[id]=j;
        if(prev[id]!==j) marcas[id]=ahora;
        if(lapidas[id]) delete lapidas[id];         // volvió a existir
      });
      Object.keys(prev).forEach(id=>{               // desapareció: queda constancia del borrado
        if(id in ahoraIt) return;
        lapidas[id]=ahora; delete marcas[id];
      });
      sombraIt[k]=ahoraIt;
    }
  });
}
const guardar=()=>{ sellarCambios(); programarSubida();
  return Guardado.escribir(CLAVE,E).then(ok=>{
    if(ok===false) aviso('Este equipo se llenó — descarga un respaldo y libera arcos viejos');
    return ok;
  });
};

const BUFFS_RACHA=[

  {d:7,   n:'Brasa',            e:'El cuerpo pide la hora antes que el reloj'},

function rachaFlexible(){
  const s=new Set(E.diario||[]);
  let dias=0, ventana=[], cursor=hoy();
  if(!s.has(cursor)) cursor=menosDias(cursor,1);
  for(let k=0;k<400;k++){
    const hecho=s.has(cursor);
    ventana.push(hecho); if(ventana.length>10) ventana.shift();
    if(ventana.filter(v=>!v).length>2) break;
    if(hecho) dias++;
    else if(dias===0) break;
    cursor=menosDias(cursor,1);
  }
  const fallos=Array.from({length:10},(_,i)=>menosDias(hoy(),i+1)).filter(f=>!s.has(f)).length;
  return {dias, comodines:Math.max(0,2-fallos)};
}

  BUFFS_RACHA.forEach(x=>{ if(r>=x.d) b=x; });

  const v=document.getElementById('aviso'); if(v) v.remove();

function equipar(i,slot){
  if(i===null||i===undefined||!E.objetos[i]) return;
  const o=E.objetos[i];
  if(o.req&&(E.stats[o.req.stat]||0)<o.req.valor){
    aviso(`Requiere ${o.req.stat} ${o.req.valor} · llevas ${E.stats[o.req.stat]||0}`);
    soltarNada(); pintar(); return;
  }
  if(o.tipo!==slot){                              // cada objeto solo entra donde corresponde
    const b=document.querySelector(`.slot[data-slot="${slot}"]`);
    if(b){ b.classList.add('rechaza'); setTimeout(()=>b.classList.remove('rechaza'),360); }
    aviso(o.tipo?`${o.nombre} es de tipo ${o.tipo}`:`${o.nombre} no tiene tipo asignado`);
    soltarNada(); pintar(); return;
  }
  ajustarCupo(i,slot);

/* ---- lectura de imágenes: se redimensiona y comprime antes de guardar ----
   Esta función faltaba en el archivo: por eso TODA subida (objeto, botín,
   viñeta, logo, retrato, escudo) caía en el catch y avisaba "No se pudo leer
   esa imagen". */
const TOPE_IMG=520000;                                  // ~520 KB por imagen (por defecto)
function leerImagen(archivo,lado,tope){
  const TOPE=tope||TOPE_IMG;
  return new Promise((resolve,reject)=>{
    if(!archivo) return reject(new Error('No llegó ninguna imagen'));
    if(archivo.type&&!/^image\//.test(archivo.type))
      return reject(new Error('Ese archivo no es una imagen'));
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error('No se pudo abrir ese archivo'));
    fr.onload=()=>{
      const original=fr.result;
      const img=new Image();
      img.onerror=()=>reject(new Error('Ese formato no se puede leer aquí (prueba JPG o PNG)'));
      img.onload=()=>{
        try{
          const max=lado||480, mayor=Math.max(img.width,img.height);
          /* si el archivo ya viene en buen tamaño y cabe, se guarda TAL CUAL:
             recomprimir de nuevo es lo que dejaba las viñetas blandas */
          if(mayor<=max*1.1&&original.length<=TOPE) return resolve(original);

          const conAlfa=/png|webp|svg/i.test(archivo.type||'');
          const dibujar=lim=>{
            const e=Math.min(1,lim/mayor||1);
            const w=Math.max(1,Math.round(img.width*e)), h=Math.max(1,Math.round(img.height*e));
            const c=document.createElement('canvas'); c.width=w; c.height=h;
            const cx=c.getContext('2d');
            cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high';
            if(!conAlfa){ cx.fillStyle='#0d0b12'; cx.fillRect(0,0,w,h); }
            cx.drawImage(img,0,0,w,h);
            return c;
          };
          /* primero se baja tamaño, nunca calidad: un JPG de 1400px al 88%
             se ve mucho mejor que uno de 2000px al 45% */
          let lim=Math.min(max,mayor), out='';
          for(let intento=0;intento<7;intento++){
            const c=dibujar(lim);
            out=c.toDataURL('image/jpeg',.92);
            if(conAlfa){
              const png=c.toDataURL('image/png');
              if(png.length<TOPE&&png.length<out.length*1.6) out=png;
            }
            if(out.length<=TOPE) break;
            const conMenos=c.toDataURL('image/jpeg',.84);
            if(conMenos.length<=TOPE){ out=conMenos; break; }
            lim=Math.round(lim*.8);
            if(lim<420){ out=dibujar(420).toDataURL('image/jpeg',.8); break; }
          }
          if(out.length>TOPE) return reject(new Error('Esa imagen pesa demasiado, usa una más liviana'));
          resolve(out);
        }catch(e){ reject(new Error('No se pudo procesar esa imagen')); }
      };
      img.src=original;
    };
    fr.readAsDataURL(archivo);
  });
}
const avisoImg=e=>aviso((e&&e.message)||'No se pudo leer esa imagen');
const TOPE_PDF=1800000;                                  // ~1.8 MB por historia
const pesoTexto=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.round(b/1024)+' KB';
function leerPDF(archivo){
  return new Promise((resolve,reject)=>{
    if(!archivo) return reject(new Error('No llegó ningún archivo'));
    const esPdf=/pdf/i.test(archivo.type||'')||/\.pdf$/i.test(archivo.name||'');
    if(!esPdf) return reject(new Error('Eso no es un PDF'));
    if(archivo.size>TOPE_PDF)
      return reject(new Error(`Ese PDF pesa ${pesoTexto(archivo.size)} · el máximo es ${pesoTexto(TOPE_PDF)}`));
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error('No se pudo abrir ese PDF'));
    fr.onload=()=>resolve({nombre:archivo.name||'historia.pdf',peso:archivo.size,datos:fr.result});
    fr.readAsDataURL(archivo);
  });
}
/* los data: no se pueden abrir directo en Chrome — se pasan por blob */
function comoBlob(dataURL){
  const [cab,b64]=dataURL.split(',');
  const tipo=(cab.match(/:(.*?);/)||[])[1]||'application/octet-stream';
  const bin=atob(b64); const buf=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  return new Blob([buf],{type:tipo});
}
function abrirArchivo(dataURL,nombre){
  try{
    const url=URL.createObjectURL(comoBlob(dataURL));
    const w=window.open(url,'_blank');
    if(!w){ const a=document.createElement('a'); a.href=url; a.download=nombre||'archivo'; a.click(); }
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){ aviso('No se pudo abrir el archivo'); }
}

const ORBITAS=[{k:1,n:'Núcleo',r:20},{k:2,n:'Órbita cercana',r:32},{k:3,n:'Órbita exterior',r:44}];
function inicial(t){ return ((t||'?').trim()[0]||'?').toUpperCase(); }
function formatear(txt){
  return esc(txt||'').split('\n').map(l=>{
    const t=l.trim();
    if(!t) return '';
    if(/^#{1,6}\s/.test(t)) return `<h4>${t.replace(/^#{1,6}\s*/,'')}</h4>`;
    const conNegrita=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(/^[-*]\s/.test(t)) return `<li>${conNegrita.replace(/^[-*]\s*/,'')}</li>`;
    return `<p>${conNegrita}</p>`;
  }).join('');
}

const orbitaDe=r=>r<26?1:r<38?2:3;
function activarArrastre(){
  const caja=document.querySelector('.sistema'); if(!caja) return;
  caja.querySelectorAll('.planeta[data-i]').forEach(el=>{
    const i=+el.dataset.i;
    hacerArrastrable(el,{
      alMover:ev=>{
        const c=caja.getBoundingClientRect();
        const x=(ev.clientX-c.left)/c.width*100-50, y=(ev.clientY-c.top)/c.height*100-50;
        const r=Math.max(13,Math.min(46,Math.hypot(x,y)));
        const ang=Math.atan2(y,x);
        el.style.left=(50+Math.cos(ang)*r)+'%';
        el.style.top=(50+Math.sin(ang)*r)+'%';
        el.className='planeta orb'+orbitaDe(r)+' agarrado';
        el.dataset.r=r; el.dataset.ang=ang*180/Math.PI;
      },
      alSoltar:()=>{
        const p=E.pactos[i];
        p.r=Math.round(+el.dataset.r*10)/10;
        p.ang=Math.round(+el.dataset.ang*10)/10;
        p.orbita=orbitaDe(p.r);
        guardar(); pintar();
      },
      alTocar:()=>abrirPacto(i)
    });
  });
}

function sigla(nombre){
  const menores=['de','del','la','el','los','las','y','en','donde'];
  const p=(nombre||'').trim().split(/[\s-]+/).filter(Boolean);
  const fuertes=p.filter(w=>!menores.includes(w.toLowerCase()));
  const base=fuertes.length?fuertes:p;
  if(!base.length) return '?';
  return (base.length===1?base[0].slice(0,2):base[0][0]+base[1][0]).toUpperCase();
}

function borrarNodo(i){
  E.tesoreria.forEach(m=>{                       // reindexar los asientos de los demás nodos

  });

function reubicarNodo(desde,hasta){
  if(desde===hasta) return;
  const orden=E.nodos.map((_,k)=>k);
  const [n]=E.nodos.splice(desde,1); E.nodos.splice(hasta,0,n);
  const [o]=orden.splice(desde,1); orden.splice(hasta,0,o);
  const mapa={}; orden.forEach((viejo,nuevo)=>mapa[viejo]=nuevo);
  E.tesoreria.forEach(m=>{ if(m.destino!==''&&mapa[+m.destino]!==undefined) m.destino=String(mapa[+m.destino]); });
  guardar(); pintar();
}
function hacerArrastrable(el,{alMover,alSoltar,alTocar}){
  let armado=false, movido=false, temporizador=null, id=null, x0=0, y0=0, tactil=false;
  const desarmar=()=>{ clearTimeout(temporizador); temporizador=null; armado=false;
    el.classList.remove('agarrado','listo'); if(id!==null&&el.hasPointerCapture(id)) el.releasePointerCapture(id); id=null; };
  let ultimo=null;
  el.addEventListener('pointerdown',ev=>{
    ev.preventDefault();
    id=ev.pointerId; x0=ev.clientX; y0=ev.clientY; ultimo=ev;
    movido=false; armado=false;
    tactil=ev.pointerType!=='mouse';
    try{ el.setPointerCapture(id); }catch(e){}
    if(!tactil) armado=true;                              // ratón: listo de inmediato
    else temporizador=setTimeout(()=>{                    // dedo: sostener para agarrar
      armado=true; el.classList.add('listo');
      if(navigator.vibrate) navigator.vibrate(12);
      if(ultimo) alMover(ultimo);
    },240);
  });
  el.addEventListener('pointermove',ev=>{
    if(id===null||ev.pointerId!==id) return;
    ultimo=ev;
    const d=Math.hypot(ev.clientX-x0,ev.clientY-y0);
    if(!armado){
      if(tactil&&d>14){ clearTimeout(temporizador); temporizador=null;   // fue un desplazamiento
        try{ el.releasePointerCapture(id); }catch(e){} id=null; }
      return;
    }
    if(d>4){ movido=true; el.classList.add('agarrado'); }
    if(movido) alMover(ev);
  });
  const fin=()=>{
    if(id===null){ clearTimeout(temporizador); temporizador=null; return; }
    const hubo=movido; desarmar();
    if(hubo) alSoltar(); else alTocar();
  };
  el.addEventListener('pointerup',fin);
  el.addEventListener('lostpointercapture',()=>{ if(id!==null&&!movido) return; });
  el.addEventListener('pointercancel',()=>{ const hubo=movido; desarmar(); if(hubo) alSoltar(); });
}

let giro=0, rafGiro=null, giroPausa=false, giroT=0;
function aplicarGiro(){
  const capas=[document.getElementById('giroCapa'),document.getElementById('giroCapa2')];
  capas.forEach(c=>{ if(c) c.style.transform='rotate('+giro.toFixed(2)+'deg)'; });
  document.querySelectorAll('.constelacion .nodo-orbe').forEach(o=>{
    if(!o.classList.contains('agarrado'))
      o.style.transform='translate(-50%,-50%) rotate('+(-giro).toFixed(2)+'deg)';
  });
}
function girarNodos(t){
  const capa=document.getElementById('giroCapa2');
  if(!capa||tab!=='nodos'||nodoAbierto!==null){ rafGiro=null; return; }
  if(!giroT) giroT=t;
  const dt=(t-giroT)/1000; giroT=t;
  if(E.giroNodos&&!giroPausa) giro=(giro+dt*9)%360;      // una vuelta cada 40 segundos
  aplicarGiro();
  rafGiro=requestAnimationFrame(girarNodos);
}
function arrancarGiro(){
  giroT=0;
  aplicarGiro();
  if(rafGiro===null) rafGiro=requestAnimationFrame(girarNodos);
}
function activarArrastreNodos(){
  const caja=document.querySelector('.constelacion'); if(!caja) return;
  const N=E.nodos.length, R=37;
  caja.querySelectorAll('.nodo-orbe[data-i]').forEach(el=>{
    const i=+el.dataset.i; let destino=i;
    hacerArrastrable(el,{
      alMover:ev=>{
        giroPausa=true;
        const c=caja.getBoundingClientRect();
        const x=(ev.clientX-c.left)/c.width*100-50, y=(ev.clientY-c.top)/c.height*100-50;
        const ang=Math.atan2(y,x)-giro*Math.PI/180;      // coordenadas de la capa que gira
        el.style.left=(50+Math.cos(ang)*R)+'%';
        el.style.top=(50+Math.sin(ang)*R)+'%';
        destino=((Math.round((ang+Math.PI/2)/(2*Math.PI/N))%N)+N)%N;
        caja.querySelectorAll('.nodo-orbe').forEach(o=>o.classList.remove('hueco-destino'));
        const otro=caja.querySelector(`.nodo-orbe[data-i="${destino}"]`);
        if(otro&&otro!==el) otro.classList.add('hueco-destino');
      },
      alSoltar:()=>{
        giroPausa=false;
        caja.querySelectorAll('.nodo-orbe').forEach(o=>o.classList.remove('hueco-destino'));
        if(destino===i) pintar(); else reubicarNodo(i,destino);
      },
      alTocar:()=>abrirNodo(i)
    });
  });
}

function alternarMov(ei,mi){
  const m=E.nodos[nodoAbierto].etapas[ei].movimientos[mi];
  if(!m.t) return editarEtapas(nodoAbierto);
  m.h=!m.h; if(m.h) ganarXP(XP.movimiento); guardar(); pintar();
  if(!m.h) return;
  const etapa=E.nodos[nodoAbierto].etapas[ei];
  if(etapa.movimientos.every(x=>x.h&&x.t)) abrirArcoEtapa(ei,true);   // etapa cerrada: toca su arco
  else if(m.recompensa||m.vinetas.filter(Boolean).length) abrirArco(ei,mi,true);
}

function ampliarVineta(id){
  const el=document.getElementById(id); if(!el) return;
  const src=el.src;
  const v=document.createElement('div'); v.className='velo'; v.id='lupa'; v.style.zIndex=50;
  v.innerHTML=`<div class="lupa-caja"><img class="lupa-img" src="${src}" alt="Viñeta"></div>
    <div class="lupa-pie">
      <span class="lupa-info"></span>
      <button class="btn">Tamaño real</button>
      <button class="btn rojo">Cerrar</button>
    </div>`;
  const im=v.querySelector('.lupa-img'), info=v.querySelector('.lupa-info');
  const medir=()=>{
    const w=im.naturalWidth,h=im.naturalHeight;
    info.textContent=`${w}×${h}`+(w<1100?' · baja resolución, vuelve a subirla':'');
    info.classList.toggle('floja',w<1100);
  };
  im.complete?medir():im.addEventListener('load',medir);
  const [real,cerrar]=v.querySelectorAll('.lupa-pie .btn');
  real.onclick=ev=>{ ev.stopPropagation(); abrirArchivo(src,'vineta.jpg'); };
  cerrar.onclick=ev=>{ ev.stopPropagation(); v.remove(); };
  v.querySelector('.lupa-img').onclick=ev=>{ ev.stopPropagation(); ev.target.classList.toggle('zoom'); };
  v.onclick=()=>v.remove();
  document.body.appendChild(v);
}

/* ==================== tesorería ==================== */
const TIPOS=[{k:'inversion',n:'Inversión'},{k:'ingreso',n:'Ingreso'},{k:'gasto',n:'Gasto'}];
const plata=v=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(v||0);
const nombreDestino=d=>d===null||d===undefined||d===''?'Personal':(E.nodos[d]?E.nodos[d].nombre:'Nodo retirado');

function vistaTesoreria(){
  const mov=[...E.tesoreria].sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  const vis=mov.filter(m=> filtroTes==='Todo' ? true
                        : filtroTes==='Personal' ? (m.destino===''||m.destino===null)
                        : String(m.destino)===filtroTes);
  const suma=k=>vis.filter(m=>m.tipo===k).reduce((a,m)=>a+(+m.monto||0),0);
  const inv=suma('inversion'), ing=suma('ingreso'), gas=suma('gasto');

  const porNodo=E.nodos.map((n,i)=>({
    n,i,
    inv:E.tesoreria.filter(m=>String(m.destino)===String(i)&&m.tipo==='inversion').reduce((a,m)=>a+(+m.monto||0),0),
    ing:E.tesoreria.filter(m=>String(m.destino)===String(i)&&m.tipo==='ingreso').reduce((a,m)=>a+(+m.monto||0),0)
  })).filter(x=>x.inv||x.ing);

  return `<section>
    <div class="titulo"><h2>Tesorería</h2>
      <button class="btn oro" onclick="nuevoMovimiento()">Registrar</button></div>
    <p class="lead">Lo que entra, lo que sale y lo que estás sembrando en cada frente.</p>

    <div class="arcas">
      <div class="arca"><b>Invertido</b><span>${plata(inv)}</span></div>
      <div class="arca"><b>Ingresos</b><span class="verde">${plata(ing)}</span></div>
      <div class="arca"><b>Gastos</b><span class="rojo">${plata(gas)}</span></div>
      <div class="arca destacada"><b>Balance</b><span>${plata(ing-gas-inv)}</span></div>
    </div>

    <div class="chips" style="margin-top:var(--s3)">
      ${[{k:'Todo',n:'Todo'},{k:'Personal',n:'Personal'},...E.nodos.map((n,i)=>({k:String(i),n:n.nombre}))]
        .map(c=>`<button class="chip ${filtroTes===c.k?'on':''}" onclick="filtroTes='${c.k}';pintar()">${esc(c.n)}</button>`).join('')}
    </div>

    ${porNodo.length&&filtroTes==='Todo'?`
      <div class="titulo" style="margin:var(--s4) 0 var(--s2)"><span class="eyebrow">Retorno por nodo</span></div>
      <div class="retornos">
        ${porNodo.map(x=>{const r=x.inv?Math.min(100,x.ing/x.inv*100):0;return `
          <div class="retorno">
            <div class="retorno-t"><b>${esc(x.n.nombre)}</b><i>${x.inv?Math.round(x.ing/x.inv*100):0}%</i></div>
            <div class="xp-b"><i style="width:${r}%"></i></div>
            <div class="xp-l"><span>Sembrado ${plata(x.inv)}</span><span>Devuelto ${plata(x.ing)}</span></div>
          </div>`;}).join('')}
      </div>`:''}

    <div class="titulo" style="margin:var(--s4) 0 var(--s2)"><span class="eyebrow">Movimientos</span>
      <span class="eyebrow">${vis.length}</span></div>
    ${vis.length?`<div class="libro">${vis.map(m=>`
      <div class="asiento ${m.tipo}" onclick="editarMovimiento('${m.id}')">
        <div class="asiento-f">${esc((m.fecha||'').split('-').reverse().join('/'))}</div>
        <div style="flex:1;min-width:0">
          <b>${esc(m.concepto)||'Sin concepto'}</b>
          <i>${TIPOS.find(t=>t.k===m.tipo)?.n||''} · ${esc(nombreDestino(m.destino))}</i>
        </div>
        <div class="asiento-m">${m.tipo==='ingreso'?'+':'−'}${plata(m.monto).replace('-','')}</div>
      </div>`).join('')}</div>`
      :`<div class="vacio">Sin movimientos registrados en esta vista.</div>`}
  </section>`;
}

    destino:'',concepto:'',monto:0});
  guardar(); editarMovimiento(E.tesoreria[E.tesoreria.length-1].id);

  const m=E.tesoreria.find(x=>x.id===id); if(!m) return;

function guardarMovimiento(id){
  const m=E.tesoreria.find(x=>x.id===id); if(!m) return;
  m.tipo=$('#tT').value; m.destino=$('#tD').value; m.concepto=$('#tC').value;
  m.monto=parseFloat($('#tM').value)||0; m.fecha=$('#tF').value||hoy();
  guardar(); cerrarVelo(); pintar();
}
function borrarMovimiento(id){
  E.tesoreria=E.tesoreria.filter(x=>x.id!==id); guardar(); cerrarVelo(); pintar();
}

/* ==================== biblioteca ==================== */
function todosLosArcos(){
  const out=[];
  E.nodos.forEach((n,ni)=>n.etapas.forEach((e,ei)=>{
    e.movimientos.forEach((m,mi)=>{
      if(m.vinetas.filter(Boolean).length||m.recompensa||m.pdf)
        out.push({n,ni,e,ei,mi,vinetas:m.vinetas,hecho:m.h,pdf:!!m.pdf,
                  titulo:m.t||'Movimiento sin definir',sub:`${n.nombre} · ${e.nombre}`});
    });
    if(vinEtapa(e).length||(e.arco&&(e.arco.nota||e.arco.pdf)))
      out.push({n,ni,e,ei,mi:null,vinetas:e.arco.vinetas,pdf:!!(e.arco&&e.arco.pdf),
                hecho:e.movimientos.every(m=>m.h&&m.t),
                titulo:e.nombre,sub:`${n.nombre} · arco de la etapa`});
  }));
  return out;
}

  E.nodos.forEach((n,ni)=>n.etapas.forEach((e,ei)=>{ if(e.archivada) archivadas.push({n,ni,e,ei}); }));

  return `<section>
    <div class="titulo"><h2>Biblioteca</h2><span class="eyebrow">${arcos.length} arcos</span></div>
    <p class="lead">Todo lo que ya viviste, guardado. Cada arco es un tramo de la historia.</p>

    <div class="chips">
      ${[{k:'Todo',n:'Todo'},...E.nodos.map((n,i)=>({k:String(i),n:n.nombre}))]
        .map(c=>`<button class="chip ${filtroBib===c.k?'on':''}" onclick="filtroBib='${c.k}';pintar()">${esc(c.n)}</button>`).join('')}
    </div>

    ${vis.length?`<div class="estantes">
      ${vis.map(a=>{const portada=a.vinetas.find(Boolean);const total=a.vinetas.filter(Boolean).length;
        return `<button class="tomo ${a.hecho?'sellado':''}" onclick="abrirArcoDesde(${a.ni},${a.ei},${a.mi===null?'null':a.mi})">
          <div class="tomo-img">${portada?`<img src="${portada}" alt="" loading="lazy" decoding="async">`:`<span>✦</span>`}</div>
          <div class="tomo-t">
            <b>${esc(a.titulo)}</b>
            <i>${esc(a.sub)}</i>
            <u>${total}/8 viñetas${a.pdf?' · historia':''}${a.hecho?' · sellado':''}</u>
          </div>
        </button>`;}).join('')}
    </div>`:`<div class="vacio">Todavía no has guardado ningún arco. Se llenan desde los movimientos de cada nodo.</div>`}

    <div class="titulo" style="margin:var(--s5) 0 var(--s2)"><span class="eyebrow">Etapas archivadas</span>
      <span class="eyebrow">${archivadas.length}</span></div>
    ${archivadas.length?archivadas.map(x=>`
      <div class="etapa completa" style="margin-bottom:var(--s1)">
        <div class="etapa-t"><h3 style="font-size:17px">${esc(x.e.nombre)}</h3>
          <button class="btn" onclick="desarchivarEtapa(${x.ni},${x.ei})">Devolver al nodo</button></div>
        <div class="eyebrow">${esc(x.n.nombre)}</div>

        <div class="btn-fila"><button class="btn" onclick="abrirArcoDesde(${x.ni},${x.ei},null)">
          ${vinEtapa(x.e).length?`Arco de la etapa · ${vinEtapa(x.e).length}/8`:'Subir arco de la etapa'}</button></div>
      </div>`).join('')
      :`<div class="vacio">Ninguna etapa archivada. Cuando cierres una completa, la mandas aquí desde el nodo.</div>`}

}

function guardarBotin(ni,ei){
  const e=E.nodos[ni].etapas[ei], prev=e.botin||{};
  const nombre=$('#bN').value.trim();
  if(!nombre){ aviso('Ponle nombre al objeto'); return; }
  e.botin={nombre, tipo:$('#bT').value, rareza:$('#bR').value||'Botín de etapa',
           efecto:$('#bE').value, img:imgTemp||'', reclamado:!!prev.reclamado};
  imgTemp=''; guardar(); cerrarVelo(); pintar();
}
function reclamarBotin(ni,ei){
  const e=E.nodos[ni].etapas[ei], b=e.botin;
  if(!b||b.reclamado) return;
  E.objetos.push({nombre:b.nombre,rareza:b.rareza||'Botín de etapa',tipo:b.tipo||'',
    equipado:false,req:null,img:b.img||'',
    desc:`Ganado al cerrar ${e.nombre} en ${E.nodos[ni].nombre}.`,efecto:b.efecto||''});
  b.reclamado=true; ganarXP(XP.botin); guardar(); pintar();
  const v=document.createElement('div'); v.id='consagracion';
  v.innerHTML=`<div>
    <div class="eyebrow">Etapa cerrada</div>
    <h2>${esc(b.nombre)}</h2>
    ${b.img?`<img src="${b.img}" alt="" style="width:150px;height:150px;object-fit:cover;border-radius:3px;margin:16px auto;display:block;border:1px solid rgba(201,166,63,.5)">`:''}
    <p>${esc(b.efecto)||'Pasa a tu arcón.'}</p>
    <button class="btn oro" onclick="this.closest('#consagracion').remove()">Guardarlo</button>
  </div>`;
  document.body.appendChild(v);
}
function archivarEtapa(ni,ei){ E.nodos[ni].etapas[ei].archivada=true; guardar(); pintar(); }
function desarchivarEtapa(ni,ei){ E.nodos[ni].etapas[ei].archivada=false; guardar(); pintar(); }

/* ==================== el claro ==================== */
const TIPOS_ACTO=[{k:'llena',n:'Me llena'},{k:'ayuda',n:'Ayuda a otros'},{k:'ambas',n:'Las dos'}];
const GRADOS=[
  {u:0,   n:'Primer contacto'},
  {u:10,  n:'Aprendiz'},
  {u:30,  n:'Practicante'},
  {u:75,  n:'Diestro'},
  {u:150, n:'Avezado'},
  {u:300, n:'Veterano'},
  {u:600, n:'Maestro'}
];
function grado(s){
  let i=0; GRADOS.forEach((g,k)=>{ if(s>=g.u) i=k; });
  const sig=GRADOS[i+1];
  return {n:GRADOS[i].n, base:GRADOS[i].u, techo:sig?sig.u:null, sig:sig?sig.n:null,
          pct:sig?(s-GRADOS[i].u)/(sig.u-GRADOS[i].u)*100:100, faltan:sig?sig.u-s:0};
}

function fechaISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function panelFecha(id,off){
  const a=E.actos.find(x=>x.id===id); if(!a) return;
  if(off!==undefined) panelMes=off; else panelMes=0;
  const base=new Date(); base.setDate(1); base.setMonth(base.getMonth()+panelMes);
  const anio=base.getFullYear(), mes=base.getMonth();
  const dias=new Date(anio,mes+1,0).getDate();
  const desfase=(new Date(anio,mes,1).getDay()+6)%7;
  const nm=base.toLocaleDateString('es-CO',{month:'long',year:'numeric'});
  const hoyStr=hoy();
  const manana=new Date(); manana.setDate(manana.getDate()+1);
  const sabado=new Date(); sabado.setDate(sabado.getDate()+((6-sabado.getDay()+7)%7||7));

  let celdas='';
  for(let i=0;i<desfase;i++) celdas+='<div class="pd fuera"></div>';
  for(let d=1;d<=dias;d++){
    const f=`${anio}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    celdas+=`<button class="pd ${f===hoyStr?'hoy':''} ${f===a.fecha?'sel':''}"
      onclick="ponerFecha('${id}','${f}')">${d}</button>`;
  }
  velo(`<h2 style="font-size:24px">${esc(a.nombre)}</h2>
    <div class="eyebrow" style="margin-top:4px">${a.fecha?'Agendado para '+esc(a.fecha.split('-').reverse().join('/')):'Sin fecha'}</div>
    <div class="btn-fila">
      <button class="btn" onclick="ponerFecha('${id}','${hoyStr}')">Hoy</button>
      <button class="btn" onclick="ponerFecha('${id}','${fechaISO(manana)}')">Mañana</button>
      <button class="btn" onclick="ponerFecha('${id}','${fechaISO(sabado)}')">Este sábado</button>
    </div>
    <div class="panel-cal">
      <div class="cal-barra">
        <button class="btn" onclick="panelFecha('${id}',${panelMes-1})">←</button>
        <b>${nm.charAt(0).toUpperCase()+nm.slice(1)}</b>
        <button class="btn" onclick="panelFecha('${id}',${panelMes+1})">→</button>
      </div>
      <div class="cal-sem">${['L','M','X','J','V','S','D'].map(d=>`<span>${d}</span>`).join('')}</div>
      <div class="panel-rejilla">${celdas}</div>
    </div>
    <div class="btn-fila">
      ${a.fecha?`<button class="btn rojo" onclick="ponerFecha('${id}','')">Quitar fecha</button>`:''}
      <button class="btn" onclick="cerrarVelo()">Cerrar</button>
    </div>`);
}
function ponerFecha(id,f){
  const a=E.actos.find(x=>x.id===id); if(!a) return;
  a.fecha=f; guardar(); cerrarVelo(); pintar();
  if(f) aviso('Agendado · '+f.split('-').reverse().join('/'));
}
function calendario(){
  const base=new Date(); base.setDate(1); base.setMonth(base.getMonth()+mesOffset);
  const anio=base.getFullYear(), mes=base.getMonth();
  const primero=new Date(anio,mes,1), dias=new Date(anio,mes+1,0).getDate();
  const desfase=(primero.getDay()+6)%7;                     // semana que empieza en lunes
  const nombreMes=primero.toLocaleDateString('es-CO',{month:'long',year:'numeric'});
  const hoyStr=hoy();
  const celda=[];
  for(let i=0;i<desfase;i++) celda.push('<div class="dia fuera"></div>');
  for(let d=1;d<=dias;d++){
    const f=`${anio}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hoyEs=f===hoyStr;
    const del=E.actos.filter(a=>a.fecha===f);
    celda.push(`<div class="dia ${hoyEs?'hoy':''} ${del.length?'con':''}">
      <span class="num">${d}</span>
      ${del.map(a=>`<button class="marca-dia ${a.tipo}" onclick="panelFecha('${a.id}')"
        title="${esc(a.nombre)}">${esc(a.nombre)}</button>`).join('')}
    </div>`);
  }
  return `<div class="calendario">
    <div class="cal-barra">
      <button class="btn" onclick="mesOffset--;pintar()">←</button>
      <b>${nombreMes.charAt(0).toUpperCase()+nombreMes.slice(1)}</b>
      <div class="btn-fila" style="margin:0">
        ${mesOffset!==0?`<button class="btn" onclick="mesOffset=0;pintar()">Hoy</button>`:''}
        <button class="btn" onclick="mesOffset++;pintar()">→</button>
      </div>
    </div>
    <div class="cal-sem">${['L','M','X','J','V','S','D'].map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="cal-rejilla">${celda.join('')}</div>
  </div>`;
}
function nuevoActo(){
  E.actos.push({id:'a'+Math.random().toString(36).slice(2,9),nombre:'Acto sin nombre',tipo:'llena',lugar:'',fecha:'',vividas:[]});
  guardar(); editarActo(E.actos[E.actos.length-1].id);
}
function agendarActo(id,f){ const a=E.actos.find(x=>x.id===id); if(a){ a.fecha=f; guardar(); pintar(); } }
function vivirActo(id){

  if(!a.fecha) return aviso('Agenda una fecha primero');
  a.vividas.push(a.fecha); a.fecha=''; ganarXP(XP.acto); guardar(); pintar();

function guardarActo(id){

  a.nombre=$('#acN').value||'Acto sin nombre'; a.tipo=$('#acT').value; a.lugar=$('#acL').value;

function borrarActo(id){ E.actos=E.actos.filter(x=>x.id!==id); guardar(); cerrarVelo(); pintar(); }

function nuevaHabilidad(){
  E.habilidades.push({id:'h'+Math.random().toString(36).slice(2,9),nombre:'Habilidad sin nombre',nota:'',sesiones:[]});
  guardar(); editarHabilidad(E.habilidades[E.habilidades.length-1].id);
}
function sesionHabilidad(id){
  const hb=E.habilidades.find(x=>x.id===id); if(!hb) return;
  if(hb.sesiones.includes(hoy())) return aviso('Ya registraste ' + hb.nombre + ' hoy');
  const antes=grado(hb.sesiones.length).n;
  hb.sesiones.push(hoy()); ganarXP(XP.habilidad); guardar(); pintar();
  const ahora=grado(hb.sesiones.length).n;
  if(ahora!==antes) aviso(`${hb.nombre} · ${ahora}`);
}

/* ---- vínculo: la configuración vive APARTE del estado ----
